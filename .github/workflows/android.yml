name: Build Android APK

on:
  workflow_dispatch:

jobs:

  build:

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull Latest Changes
        run: git pull origin main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Dependencies
        run: npm install

      - name: Generate Android Icons
        run: |

          node <<EOF

          const fs = require("fs");
          const sharp = require("sharp");

          const iconPath =
            "android-template/WebAppEngine/icon.txt";

          if(!fs.existsSync(iconPath)){

            console.log(
              "No icon.txt found"
            );

            process.exit(0);

          }

          const base64 =
            fs.readFileSync(
              iconPath,
              "utf8"
            );

          const buffer =
            Buffer.from(
              base64,
              "base64"
            );

          const icons = [

            {
              size:48,
              folder:"mipmap-mdpi"
            },

            {
              size:72,
              folder:"mipmap-hdpi"
            },

            {
              size:96,
              folder:"mipmap-xhdpi"
            },

            {
              size:144,
              folder:"mipmap-xxhdpi"
            },

            {
              size:192,
              folder:"mipmap-xxxhdpi"
            }

          ];

          async function run(){

            for(const item of icons){

              const output =
                await sharp(buffer)

                .resize(
                  item.size,
                  item.size
                )

                .png()

                .toBuffer();

              const launcherPath =

`android-template/WebAppEngine/app/src/main/res/${item.folder}/ic_launcher.png`;

              const roundPath =

`android-template/WebAppEngine/app/src/main/res/${item.folder}/ic_launcher_round.png`;

              fs.writeFileSync(
                launcherPath,
                output
              );

              fs.writeFileSync(
                roundPath,
                output
              );

              console.log(
                "Generated:",
                launcherPath
              );

            }

          }

          run();

          EOF

      - name: Remove Old Icons
        run: |

          find android-template/WebAppEngine/app/src/main/res -name "*.webp" -delete

          find android-template/WebAppEngine/app/src/main/res -name "ic_launcher.webp" -delete

          find android-template/WebAppEngine/app/src/main/res -name "ic_launcher_round.webp" -delete

      - name: Force Clean Build
        run: |

          cd android-template/WebAppEngine

          chmod +x gradlew

          ./gradlew clean

      - name: Build APK
        run: |

          cd android-template/WebAppEngine

          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: generated-apk
          path: |

            android-template/WebAppEngine/app/build/outputs/apk/debug/*.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:

          tag_name: release-${{ github.run_id }}

          files: |

            android-template/WebAppEngine/app/build/outputs/apk/debug/*.apk