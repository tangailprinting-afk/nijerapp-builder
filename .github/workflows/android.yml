name: Build Android APK

on:
  workflow_dispatch:

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull Latest Changes
        run: git pull origin main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Dependencies
        run: npm install

      - name: Remove Old Icons
        run: |

          rm -f android-template/WebAppEngine/app/src/main/res/mipmap-mdpi/*.webp
          rm -f android-template/WebAppEngine/app/src/main/res/mipmap-hdpi/*.webp
          rm -f android-template/WebAppEngine/app/src/main/res/mipmap-xhdpi/*.webp
          rm -f android-template/WebAppEngine/app/src/main/res/mipmap-xxhdpi/*.webp
          rm -f android-template/WebAppEngine/app/src/main/res/mipmap-xxxhdpi/*.webp

      - name: Build APK
        run: |

          cd android-template/WebAppEngine

          chmod +x gradlew

          ./gradlew clean

          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: generated-apk
          path: android-template/WebAppEngine/app/build/outputs/apk/debug/app-debug.apk