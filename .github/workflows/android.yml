name: Build Android APK

on:
  workflow_dispatch:

jobs:

  build:

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Grant Gradle Permission
        run: chmod +x android-template/WebAppEngine/gradlew

      - name: Delete Old Icons
        run: |

          find android-template/WebAppEngine/app/src/main/res -name "*.webp" -delete

      - name: Build APK
        run: |

          cd android-template/WebAppEngine

          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: |

            android-template/WebAppEngine/app/build/outputs/apk/debug/*.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:

          tag_name: release-${{ github.run_id }}

          files: |

            android-template/WebAppEngine/app/build/outputs/apk/debug/*.apk