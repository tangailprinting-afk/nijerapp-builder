<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Rizq Restaurant</title>
    <script src="common.js"></script>
    <script src="frameworkdb.js"></script>
    <style>
        :root {
            --bg-1: #0f172a;
            --bg-2: #1d4ed8;
            --bg-3: #7c3aed;
            --card: rgba(255,255,255,0.96);
            --text: #0f172a;
            --muted: #64748b;
            --border: rgba(148,163,184,0.22);
            --primary: #4f46e5;
            --primary-2: #7c3aed;
            --shadow: 0 24px 60px rgba(15,23,42,0.24);
        }

        * { box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            margin: 0;
            font-family:  "Segoe UI", Roboto, Helvetica, Arial, "Noto Sans", sans-serif;
            color: var(--text);
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
            background:
                radial-gradient(circle at 20% 20%, rgba(255,255,255,0.16), transparent 24%),
                radial-gradient(circle at 80% 0%, rgba(255,255,255,0.12), transparent 22%),
                linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 48%, var(--bg-3) 100%);
        }

        .shell {
            width: min(100%, 460px);
            position: relative;
        }

        .card {
            background: var(--card);
            border: 1px solid rgba(255,255,255,0.4);
            border-radius: 28px;
            box-shadow: var(--shadow);
            overflow: hidden;
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
        }

        .hero {
            padding: 28px 26px 18px;
            text-align: center;
            position: relative;
        }

        .hero::before {
            content: '';
            position: absolute;
            inset: 0 0 auto 0;
            height: 5px;
            background: linear-gradient(90deg, #22c55e, #0ea5e9, #7c3aed);
        }

        .brand-mark {
            width: 68px;
            height: 68px;
            border-radius: 22px;
            display: grid;
            place-items: center;
            margin: 8px auto 18px;
            background: linear-gradient(145deg, #4f46e5, #7c3aed);
            color: #fff;
            box-shadow: 0 14px 30px rgba(79,70,229,0.35);
        }

        .brand-mark svg { width: 32px; height: 32px; }

        .hero h1 {
            margin: 0;
            font-size: 28px;
            line-height: 1.1;
            letter-spacing: -0.04em;
        }

        .hero p {
            margin: 8px 0 0;
            color: var(--muted);
            font-size: 14px;
        }

        .form-area {
            padding: 0 24px 24px;
        }

        .alert {
            display: none;
            margin-bottom: 14px;
            padding: 12px 14px;
            border-radius: 14px;
            font-size: 13px;
            line-height: 1.45;
        }

        .alert.show { display: block; }
        .alert.error {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #b91c1c;
        }
        .alert.success {
            background: #ecfdf5;
            border: 1px solid #bbf7d0;
            color: #15803d;
        }

        .field {
            margin-bottom: 16px;
        }

        .field label {
            display: block;
            margin-bottom: 8px;
            font-size: 12px;
            font-weight: 800;
            color: #334155;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        .input-wrap {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            pointer-events: none;
            width: 18px;
            height: 18px;
            display: grid;
            place-items: center;
        }

        .input-icon svg {
            width: 18px;
            height: 18px;
            display: block;
        }

        .field input {
            width: 100%;
            height: 50px;
            border-radius: 14px;
            border: 1.5px solid var(--border);
            background: #fff;
            padding: 0 46px 0 44px;
            font-size: 15px;
            color: var(--text);
            outline: none;
        }

        .field input:focus {
            border-color: rgba(79,70,229,0.7);
            box-shadow: 0 0 0 4px rgba(79,70,229,0.08);
        }

        .password-toggle {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            width: 34px;
            height: 34px;
            border: 0;
            border-radius: 10px;
            background: transparent;
            cursor: pointer;
            color: #64748b;
            display: grid;
            place-items: center;
            padding: 0;
        }

        .password-toggle svg {
            width: 18px;
            height: 18px;
            display: block;
        }

        .row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin: 8px 0 18px;
            font-size: 13px;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--muted);
            user-select: none;
        }

        .remember input { accent-color: var(--primary); }

        .forgot {
            color: var(--primary);
            text-decoration: none;
            font-weight: 700;
        }

        .forgot:hover { text-decoration: underline; }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }

        .btn {
            border: 0;
            border-radius: 14px;
            min-height: 50px;
            padding: 0 18px;
            font: inherit;
            font-weight: 800;
            cursor: pointer;
        }

        .btn-primary {
            flex: 1 1 auto;
            color: #fff;
            background: linear-gradient(135deg, var(--primary), var(--primary-2));
            box-shadow: 0 14px 30px rgba(79,70,229,0.28);
        }

        .btn-secondary {
            background: #f8fafc;
            color: #334155;
            border: 1px solid rgba(148,163,184,0.22);
        }

        .btn:disabled { opacity: 0.7; cursor: not-allowed; }

        .spinner {
            display: none;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.45);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
        }

        .btn.loading .spinner { display: inline-block; }

        .shake {
            animation: shake 0.45s ease;
        }

        .footer {
            margin-top: 16px;
            text-align: center;
            color: rgba(255,255,255,0.82);
            font-size: 12px;
        }

        .footer strong { color: #fff; }

        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-8px); }
            40% { transform: translateX(8px); }
            60% { transform: translateX(-6px); }
            80% { transform: translateX(6px); }
        }

        @media (max-width: 520px) {
            body { padding: 12px; }
            .card { border-radius: 24px; }
            .hero { padding: 24px 18px 14px; }
            .form-area { padding: 0 18px 18px; }
            .hero h1 { font-size: 24px; }
            .actions { flex-direction: column; }
            .btn { width: 100%; }
            .row { flex-direction: column; align-items: stretch; }
            .forgot { text-align: left; }
        }
    </style>
</head>
<body>
    <div class="shell">
        <div class="card" id="loginContainer">
            <div class="hero">
                <div class="brand-mark" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none">
                        <path d="M4 7.5h16M4 12h16M4 16.5h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                        <path d="M6 4h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z" stroke="currentColor" stroke-width="1.8"/>
                    </svg>
                </div>
                <h1>Rizq Restaurant</h1>
                <p>Firebase login only. No registration page.</p>
            </div>

            <div class="form-area">
                <div class="alert error" id="alertError"></div>
                <div class="alert success" id="alertSuccess"></div>

                <form id="loginForm" autocomplete="off">
                    <div class="field">
                        <label for="email">Email Address</label>
                        <div class="input-wrap">
                            <span class="input-icon" aria-hidden="true">
                                <svg viewBox="0 0 24 24" fill="none">
                                    <rect x="3.5" y="5.5" width="17" height="13" rx="3" stroke="currentColor" stroke-width="1.8"/>
                                    <path d="M5.5 7.5 12 12.5 18.5 7.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                            </span>
                            <input id="email" type="email" placeholder="Enter your email" autocomplete="email" required>
                        </div>
                    </div>

                    <div class="field">
                        <label for="password">Password</label>
                        <div class="input-wrap">
                            <span class="input-icon" aria-hidden="true">
                                <svg viewBox="0 0 24 24" fill="none">
                                    <rect x="5" y="10.5" width="14" height="9" rx="2.2" stroke="currentColor" stroke-width="1.8"/>
                                    <path d="M8 10.5V8.8a4 4 0 0 1 8 0v1.7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                                </svg>
                            </span>
                            <input id="password" type="password" placeholder="Enter your password" autocomplete="current-password" required>
                            <button type="button" class="password-toggle" id="togglePassword" aria-label="Toggle password visibility">
                                <svg viewBox="0 0 24 24" fill="none" id="togglePasswordIcon">
                                    <path d="M2.8 12s3.4-6 9.2-6 9.2 6 9.2 6-3.4 6-9.2 6-9.2-6-9.2-6Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
                                    <circle cx="12" cy="12" r="2.8" stroke="currentColor" stroke-width="1.8"/>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="row">
                        <label class="remember">
                            <input type="checkbox" id="rememberMe">
                            Remember me
                        </label>
                        <a href="#" class="forgot" id="forgotPassword">Forgot password?</a>
                    </div>

                    <div class="actions">
                        <button type="button" class="btn btn-secondary" onclick="location.href='index.html'">Home</button>
                        <button type="submit" class="btn btn-primary" id="btnLogin">
                            <span class="spinner"></span>
                            <span class="btn-text">Sign In</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
        <div class="footer">
            <strong>Rizq Restaurant</strong> powered by Firebase
        </div>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const togglePasswordBtn = document.getElementById('togglePassword');
        const rememberMeCheckbox = document.getElementById('rememberMe');
        const btnLogin = document.getElementById('btnLogin');
        const alertError = document.getElementById('alertError');
        const alertSuccess = document.getElementById('alertSuccess');
        const loginContainer = document.getElementById('loginContainer');
        const forgotPasswordLink = document.getElementById('forgotPassword');
        const togglePasswordIcon = document.getElementById('togglePasswordIcon');

        function showAlert(type, message) {
            alertError.classList.remove('show');
            alertSuccess.classList.remove('show');
            const el = type === 'error' ? alertError : alertSuccess;
            el.textContent = message;
            el.classList.add('show');
            if (type === 'error') {
                loginContainer.classList.add('shake');
                setTimeout(() => loginContainer.classList.remove('shake'), 500);
            }
            setTimeout(() => {
                alertError.classList.remove('show');
                alertSuccess.classList.remove('show');
            }, 4500);
        }

        function hideAlerts() {
            alertError.classList.remove('show');
            alertSuccess.classList.remove('show');
        }

        function loadRememberedEmail() {
            const remembered = localStorage.getItem('myframework_remembered_user');
            if (remembered) {
                emailInput.value = remembered;
                rememberMeCheckbox.checked = true;
            }
        }

        togglePasswordBtn.addEventListener('click', () => {
            const nextType = passwordInput.type === 'password' ? 'text' : 'password';
            passwordInput.type = nextType;
            togglePasswordIcon.innerHTML = nextType === 'password'
                ? '<path d="M2.8 12s3.4-6 9.2-6 9.2 6 9.2 6-3.4 6-9.2 6-9.2-6-9.2-6Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="12" cy="12" r="2.8" stroke="currentColor" stroke-width="1.8"/>'
                : '<path d="M4 4l16 16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M9.5 9.7A2.8 2.8 0 0 0 8.8 12a3.2 3.2 0 0 0 3.2 3.2c.8 0 1.5-.2 2-.7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M6 7.5C4 8.9 2.8 12 2.8 12s3.4 6 9.2 6c1.2 0 2.3-.2 3.2-.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M16.2 15.4C18 14 19.2 12 19.2 12s-3.4-6-9.2-6c-.9 0-1.7.1-2.5.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>';
        });

        forgotPasswordLink.addEventListener('click', async (e) => {
            e.preventDefault();
            hideAlerts();
            const email = emailInput.value.trim();
            if (!email) {
                showAlert('error', 'Please enter your email first.');
                emailInput.focus();
                return;
            }

            try {
                await FirebaseAuthAPI.sendPasswordResetEmail(email);
                showAlert('success', 'Password reset email sent. Please check your inbox.');
            } catch (error) {
                showAlert('error', error?.message || 'Unable to send password reset email.');
            }
        });

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideAlerts();

            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();

            if (!email) {
                showAlert('error', 'Please enter your email address.');
                emailInput.focus();
                return;
            }

            if (!password) {
                showAlert('error', 'Please enter your password.');
                passwordInput.focus();
                return;
            }

            btnLogin.classList.add('loading');
            btnLogin.disabled = true;

            try {
                await FirebaseAuthAPI.ready();
                const user = await FirebaseAuthAPI.signIn(email, password);

                if (!user) {
                    throw new Error('Login failed');
                }

                if (rememberMeCheckbox.checked) {
                    localStorage.setItem('myframework_remembered_user', email);
                } else {
                    localStorage.removeItem('myframework_remembered_user');
                }

                const sessionData = {
                    userId: user.uid,
                    email: user.email,
                    role: 'User',
                    loginTime: new Date().toISOString()
                };

                localStorage.setItem('myframework_current_user', JSON.stringify(sessionData));

                try {
                    await FrameworkDB.save('sessions', {
                        userId: user.uid,
                        email: user.email,
                        role: 'User',
                        loginTime: new Date().toISOString(),
                        userAgent: navigator.userAgent
                    });
                } catch (sessionError) {
                    console.warn('Failed to save session:', sessionError.message);
                }

                showAlert('success', `Welcome back, ${user.email || 'User'}!`);
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 700);
            } catch (error) {
                const code = error?.code || '';
                const messageMap = {
                    'auth/invalid-email': 'Please enter a valid email address.',
                    'auth/user-not-found': 'No Firebase user found for this email.',
                    'auth/wrong-password': 'Wrong password. Please try again.',
                    'auth/invalid-credential': 'Invalid email or password.',
                    'auth/too-many-requests': 'Too many attempts. Please wait and try again later.',
                    'auth/network-request-failed': 'Network error. Please check your internet connection.',
                };
                showAlert('error', messageMap[code] || `Login failed: ${error?.message || 'Unknown error'}`);
                passwordInput.value = '';
                passwordInput.focus();
            } finally {
                btnLogin.classList.remove('loading');
                btnLogin.disabled = false;
            }
        });

        emailInput.addEventListener('input', hideAlerts);
        passwordInput.addEventListener('input', hideAlerts);
        emailInput.focus();
        loadRememberedEmail();

        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                e.preventDefault();
                loginForm.requestSubmit();
            }
        });

        FirebaseAuthAPI.waitForAuth()
            .then((user) => {
                if (user) {
                    window.location.replace('index.html');
                }
            })
            .catch(() => {});
    </script>
</body>
</html>
