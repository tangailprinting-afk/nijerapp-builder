<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | MyFramework</title>
    <script src="common.js"></script>
    <script src="../frameworkdb.js"></script>

    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f1f5f9;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-light: #64748b;
            --border: #e2e8f0;
            --error-bg: #fef2f2;
            --error-text: #dc2626;
            --error-border: #fecaca;
            --success-bg: #f0fdf4;
            --success-text: #16a34a;
            --success-border: #bbf7d0;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
            --radius: 12px;
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: gradientShift 8s ease infinite;
            background-size: 200% 200%;
        }

        @keyframes gradientShift {
            0%,
            100% {
                background-position: 0% 50%;
            }
            25% {
                background-position: 100% 0%;
            }
            50% {
                background-position: 100% 100%;
            }
            75% {
                background-position: 0% 100%;
            }
        }

        .login-container {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 48px 40px;
            width: 100%;
            max-width: 440px;
            box-shadow: var(--shadow-lg);
            animation: slideUp 0.6s ease;
            position: relative;
            overflow: hidden;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: linear-gradient(90deg, #4f46e5, #7c3aed, #a855f7, #4f46e5);
            background-size: 300% 100%;
            animation: shimmer 3s ease infinite;
        }

        @keyframes shimmer {
            0%,
            100% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
        }

        .login-header {
            text-align: center;
            margin-bottom: 36px;
            margin-top: 16px;
        }

        .login-icon {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 28px;
            color: white;
            box-shadow: 0 8px 24px rgba(79, 70, 229, 0.3);
        }

        .login-header h2 {
            font-size: 26px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 6px;
            letter-spacing: -0.5px;
        }

        .login-header p {
            color: var(--text-light);
            font-size: 14px;
            font-weight: 400;
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text);
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 18px;
            color: #94a3b8;
            pointer-events: none;
            z-index: 1;
            transition: var(--transition);
        }

        .form-group input {
            width: 100%;
            padding: 14px 14px 14px 44px;
            border: 2px solid var(--border);
            border-radius: 10px;
            font-size: 15px;
            font-family: inherit;
            color: var(--text);
            background: #f8fafc;
            transition: var(--transition);
            outline: none;
        }

        .form-group input:focus {
            border-color: #4f46e5;
            background: #fff;
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.08);
        }

        .form-group input:focus+.input-icon {
            color: #4f46e5;
        }

        .password-toggle {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 18px;
            color: #94a3b8;
            padding: 4px;
            z-index: 1;
            transition: var(--transition);
        }

        .password-toggle:hover {
            color: #4f46e5;
        }

        .remember-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 28px;
            font-size: 13px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            color: var(--text-light);
            user-select: none;
        }

        .remember-me input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #4f46e5;
            cursor: pointer;
        }

        .forgot-link {
            color: #4f46e5;
            text-decoration: none;
            font-weight: 500;
            transition: var(--transition);
        }

        .forgot-link:hover {
            color: #4338ca;
            text-decoration: underline;
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            letter-spacing: 0.3px;
            position: relative;
            overflow: hidden;
            font-family: inherit;
        }

        .btn-login:hover {
            background: linear-gradient(135deg, #4338ca, #6d28d9);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(79, 70, 229, 0.35);
        }

        .btn-login:active {
            transform: translateY(0);
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
        }

        .btn-login:disabled {
            background: #94a3b8;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-login .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin: 0 auto;
        }

        .btn-login.loading .btn-text {
            display: none;
        }

        .btn-login.loading .spinner {
            display: block;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .alert {
            padding: 14px 16px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 13px;
            font-weight: 500;
            display: none;
            animation: fadeIn 0.3s ease;
            line-height: 1.5;
        }

        .alert.show {
            display: block;
        }

        .alert-error {
            background: var(--error-bg);
            color: var(--error-text);
            border: 1px solid var(--error-border);
        }

        .alert-success {
            background: var(--success-bg);
            color: var(--success-text);
            border: 1px solid var(--success-border);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .back-link {
            text-align: center;
            margin-top: 24px;
        }

        .back-link a {
            color: var(--text-light);
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            transition: var(--transition);
        }

        .back-link a:hover {
            color: #4f46e5;
        }

        .login-footer {
            text-align: center;
            margin-top: 32px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
        }

        .login-footer p {
            font-size: 12px;
            color: var(--text-light);
        }

        .login-footer span {
            color: #4f46e5;
            font-weight: 600;
        }

        /* Shake animation for error */
        .shake {
            animation: shake 0.5s ease;
        }

        @keyframes shake {
            0%,
            100% {
                transform: translateX(0);
            }
            20% {
                transform: translateX(-8px);
            }
            40% {
                transform: translateX(8px);
            }
            60% {
                transform: translateX(-6px);
            }
            80% {
                transform: translateX(6px);
            }
        }

        /* Responsive */
        @media (max-width: 480px) {
            .login-container {
                padding: 32px 20px;
                border-radius: 16px;
            }

            .login-header h2 {
                font-size: 22px;
            }

            .remember-row {
                flex-direction: column;
                gap: 10px;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>

    <div class="login-container" id="loginContainer">
        <!-- Header -->
        <div class="login-header">
            <div class="login-icon">
                🔐
            </div>
            <h2>Welcome Back</h2>
            <p>Sign in to access your dashboard</p>
        </div>

        <!-- Alert Messages -->
        <div class="alert alert-error" id="alertError"></div>
        <div class="alert alert-success" id="alertSuccess"></div>

        <!-- Login Form -->
        <form id="loginForm" autocomplete="off">
            <!-- Username -->
            <div class="form-group">
                <label for="username">Username</label>
                <div class="input-wrapper">
                    <span class="input-icon">👤</span>
                    <input
                    type="text"
                    id="username"
                    placeholder="Enter your username"
                    required
                    autocomplete="off"
                    >
                </div>
            </div>

            <!-- Password -->
            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <span class="input-icon">🔒</span>
                    <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                    autocomplete="off"
                    >
                    <button
                    type="button"
                    class="password-toggle"
                    id="togglePassword"
                    title="Show/Hide Password"
                    >
                    👁️
                </button>
            </div>
        </div>

        <!-- Remember & Forgot -->
        <div class="remember-row">
            <label class="remember-me">
                <input type="checkbox" id="rememberMe">
                Remember me
            </label>
            <a href="#" class="forgot-link" id="forgotPassword">Forgot Password?</a>
        </div>

        <!-- Login Button -->
        <button type="submit" class="btn-login" id="btnLogin">
            <span class="btn-text">Sign In</span>
            <span class="spinner"></span>
        </button>
    </form>

    <!-- Back Link -->
    <div class="back-link">
        <a href="../index.html">← Back to Home</a>
    </div>

    <!-- Footer -->
    <div class="login-footer">
        <p>Powered by <span>MyFramework</span> v1.0</p>
    </div>
</div>

<script>
    // ============================================
    // DOM Elements
    // ============================================
    const loginForm = document.getElementById('loginForm');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const togglePasswordBtn = document.getElementById('togglePassword');
    const rememberMeCheckbox = document.getElementById('rememberMe');
    const btnLogin = document.getElementById('btnLogin');
    const alertError = document.getElementById('alertError');
    const alertSuccess = document.getElementById('alertSuccess');
    const loginContainer = document.getElementById('loginContainer');
    const forgotPasswordLink = document.getElementById('forgotPassword');

    // ============================================
    // Show Alert
    // ============================================
    function showAlert(type, message) {
        // Hide both alerts
        alertError.classList.remove('show');
        alertSuccess.classList.remove('show');

        if (type === 'error') {
            alertError.textContent = message;
            alertError.classList.add('show');
            // Shake container on error
            loginContainer.classList.add('shake');
            setTimeout(() => {
                loginContainer.classList.remove('shake');
            }, 500);
        } else if (type === 'success') {
            alertSuccess.textContent = message;
            alertSuccess.classList.add('show');
        }

        // Auto hide after 5 seconds
        setTimeout(() => {
            alertError.classList.remove('show');
            alertSuccess.classList.remove('show');
        }, 5000);
    }

    function hideAlerts() {
        alertError.classList.remove('show');
        alertSuccess.classList.remove('show');
    }

    // ============================================
    // Toggle Password Visibility
    // ============================================
    togglePasswordBtn.addEventListener('click', function() {
        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordInput.setAttribute('type', type);

        // Change icon
        this.textContent = type === 'password' ? '👁️' : '🙈';
    });

    // ============================================
    // Forgot Password Handler
    // ============================================
    forgotPasswordLink.addEventListener('click', function(e) {
        e.preventDefault();
        showAlert('error', '⚠️ Please contact your system administrator to reset your password.');
    });

    // ============================================
    // Load Remembered Username
    // ============================================
    function loadRememberedUser() {
        const remembered = localStorage.getItem('myframework_remembered_user');
        if (remembered) {
            usernameInput.value = remembered;
            rememberMeCheckbox.checked = true;
        }
    }

    loadRememberedUser();

    // ============================================
    // Login Form Submit
    // ============================================
    loginForm.addEventListener('submit', async function(e) {
        e.preventDefault();
        hideAlerts();

        // Get values
        const username = usernameInput.value.trim();
        const password = passwordInput.value.trim();

        // ==========================================
        // Validation
        // ==========================================
        if (!username) {
            showAlert('error', '⚠️ Please enter your username.');
            usernameInput.focus();
            return;
        }

        if (!password) {
            showAlert('error', '⚠️ Please enter your password.');
            passwordInput.focus();
            return;
        }

        if (username.length < 3) {
            showAlert('error', '⚠️ Username must be at least 3 characters.');
            usernameInput.focus();
            return;
        }

        if (password.length < 4) {
            showAlert('error', '⚠️ Password must be at least 4 characters.');
            passwordInput.focus();
            return;
        }

        // ==========================================
        // Set Loading State
        // ==========================================
        btnLogin.classList.add('loading');
        btnLogin.disabled = true;

        try {
            // ======================================
            // Fetch Users from Database
            // ======================================
            let users = [];

            try {
                const result = await window.frameworkAPI.getData('users');

                if (result.success && Array.isArray(result.data)) {
                    users = result.data;
                } else {
                    // Fallback: Try FrameworkDB class
                    const fallbackResult = await FrameworkDB.get('users');
                    if (Array.isArray(fallbackResult)) {
                        users = fallbackResult;
                    }
                }
            } catch (apiError) {
                console.warn('API direct call failed, trying FrameworkDB:', apiError.message);
                try {
                    const fallbackResult = await FrameworkDB.get('users');
                    if (Array.isArray(fallbackResult)) {
                        users = fallbackResult;
                    }
                } catch (frameworkError) {
                    console.error('FrameworkDB call also failed:', frameworkError.message);
                }
            }

            // ======================================
            // Find Matching User
            // ======================================
            const matchedUser = users.find(user =>
                user.username === username && user.password === password
            );

            if (matchedUser) {
                // ==============================
                // Login Successful
                // ==============================
                showAlert('success', `✅ Login successful! Welcome, ${matchedUser.username}...`);

                // Remember username if checked
                if (rememberMeCheckbox.checked) {
                    localStorage.setItem('myframework_remembered_user', username);
                } else {
                    localStorage.removeItem('myframework_remembered_user');
                }

                // Save current session
                const sessionData = {
                    userId: matchedUser.id,
                    username: matchedUser.username,
                    role: matchedUser.role || 'User',
                    loginTime: new Date().toISOString()
                };

                try {
                    // Save login session to database
                    await window.frameworkAPI.saveData('sessions', {
                        userId: matchedUser.id,
                        username: matchedUser.username,
                        role: matchedUser.role || 'User',
                        loginTime: new Date().toISOString(),
                        ipAddress: 'local',
                        userAgent: navigator.userAgent
                    });
                } catch (sessionError) {
                    console.warn('Failed to save session:', sessionError.message);
                    // Non-critical error, continue
                }

                // Store in localStorage for quick access
                localStorage.setItem('myframework_current_user', JSON.stringify(sessionData));

                // Redirect to project index after a short delay
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 800);

            } else {
                // ==============================
                // Login Failed
                // ==============================
                showAlert('error', '❌ Invalid username or password. Please try again.');

                // Clear password field for security
                passwordInput.value = '';
                passwordInput.focus();

                // Log failed attempt
                console.warn(`Failed login attempt for username: "${username}" at ${new Date().toISOString()}`);

                // Save failed attempt to database (optional)
                try {
                    await window.frameworkAPI.saveData('login_attempts', {
                        username: username,
                        success: false,
                        attemptTime: new Date().toISOString(),
                        reason: 'Invalid credentials'
                    });
                } catch (logError) {
                    console.warn('Failed to log attempt:', logError.message);
                }
            }

        } catch (error) {
            // ==================================
            // Unexpected Error
            // ==================================
            console.error('Login Error:', error);
            showAlert('error', `⚠️ An error occurred: ${error.message || 'Unknown error'}. Please try again.`);

        } finally {
            // ==================================
            // Reset Loading State
            // ==================================
            btnLogin.classList.remove('loading');
            btnLogin.disabled = false;
        }
    });

    // ============================================
    // Auto-focus on username field
    // ============================================
    usernameInput.focus();

    // ============================================
    // Keyboard Shortcut: Enter to Submit
    // ============================================
    document.addEventListener('keydown', function(e) {
        // Ctrl+Enter or Cmd+Enter to submit from anywhere
        if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
            e.preventDefault();
            loginForm.dispatchEvent(new Event('submit'));
        }
    });

    // ============================================
    // Clear alert on input change
    // ============================================
    usernameInput.addEventListener('input', hideAlerts);
    passwordInput.addEventListener('input', hideAlerts);

    // ============================================
    // Log page view
    // ============================================
    console.log('📄 Login page loaded | MyFramework v1.0');
    console.log('🔗 FrameworkDB available:', typeof FrameworkDB !== 'undefined' ? 'Yes ✅' : 'No ❌');
    console.log('🔗 frameworkAPI available:', typeof window.frameworkAPI !== 'undefined' ? 'Yes ✅' : 'No ❌');
</script>

</body>
</html>
