<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Database Setup | Sultan Digital Sign</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --primary-light: #eef2ff;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #0f172a;
            --text-secondary: #64748b;
            --text-muted: #94a3b8;
            --border: #e2e8f0;
            --success: #10b981;
            --success-light: #ecfdf5;
            --danger: #ef4444;
            --danger-light: #fef2f2;
            --warning: #f59e0b;
            --warning-light: #fffbeb;
            --shadow: 0 1px 3px rgba(0,0,0,0.06);
            --shadow-md: 0 4px 6px rgba(0,0,0,0.05);
            --shadow-lg: 0 10px 25px rgba(0,0,0,0.08);
            --radius: 12px;
            --radius-sm: 8px;
            --transition: all 0.2s ease;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', 'Segoe UI', -apple-system, sans-serif;
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .setup-container {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 40px;
            max-width: 520px;
            width: 100%;
            box-shadow: var(--shadow-lg);
            text-align: center;
        }

        .logo-area {
            margin-bottom: 24px;
        }

        .logo-area .icon {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            margin: 0 auto 12px;
            box-shadow: 0 8px 24px rgba(99,102,241,0.3);
        }

        h1 {
            font-size: 24px;
            font-weight: 800;
            color: var(--text);
            letter-spacing: -0.5px;
            margin-bottom: 4px;
        }

        .subtitle {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 28px;
        }

        .option-cards {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-bottom: 20px;
        }

        .option-card {
            background: #f8fafc;
            border: 2px solid var(--border);
            border-radius: var(--radius);
            padding: 24px 16px;
            cursor: pointer;
            transition: var(--transition);
            text-align: center;
        }

        .option-card:hover {
            border-color: var(--primary);
            background: var(--primary-light);
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
        }

        .option-card .opt-icon {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .option-card h3 {
            font-size: 14px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 4px;
        }

        .option-card p {
            font-size: 11px;
            color: var(--text-muted);
            line-height: 1.4;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 12px 24px;
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            border: none;
            font-family: inherit;
            white-space: nowrap;
            text-decoration: none;
            width: 100%;
            justify-content: center;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }
        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(99,102,241,0.3);
        }

        .btn-outline {
            background: white;
            color: var(--text);
            border: 1.5px solid var(--border);
            margin-top: 8px;
        }
        .btn-outline:hover {
            background: #f8fafc;
            border-color: #94a3b8;
        }

        .result-box {
            margin-top: 16px;
            padding: 14px 16px;
            border-radius: var(--radius-sm);
            font-size: 12px;
            font-weight: 500;
            line-height: 1.5;
            text-align: left;
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .result-box.show {
            display: block;
        }

        .result-box.success {
            background: var(--success-light);
            border: 1px solid #bbf7d0;
            color: #065f46;
        }

        .result-box.error {
            background: var(--danger-light);
            border: 1px solid #fecaca;
            color: #991b1b;
        }

        .result-box.info {
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            color: #1e40af;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 20px 0;
            color: var(--text-muted);
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .existing-path {
            background: #f1f5f9;
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            font-size: 12px;
            color: var(--text-secondary);
            word-break: break-all;
            margin-top: 8px;
            text-align: left;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            body {
                align-items: flex-start;
                padding: 14px;
            }
            .setup-container {
                padding: 28px 18px;
                border-radius: 18px;
            }
            .option-cards {
                grid-template-columns: 1fr;
            }
            .option-card {
                padding: 18px 14px;
            }
            .btn {
                padding: 12px 18px;
                font-size: 13px;
            }
            .divider {
                margin: 16px 0;
            }
            .existing-path {
                font-size: 11px;
            }
        }

        @media (max-width: 480px) {
            body { padding: 10px; }
            .setup-container { padding: 22px 14px; border-radius: 16px; }
            .logo-area .icon { width: 56px; height: 56px; font-size: 26px; }
            h1 { font-size: 20px; }
            .subtitle { font-size: 12px; margin-bottom: 22px; }
            .option-card { padding: 16px 12px; }
            .option-card .opt-icon { font-size: 28px; }
            .option-card h3 { font-size: 13px; }
            .option-card p { font-size: 10px; }
            .btn { font-size: 12px; padding: 11px 14px; }
        }
    </style>
</head>
<body>

    <div class="setup-container">
        <div class="logo-area">
            <div class="icon">🖨️</div>
            <h1>Sultan Digital Sign</h1>
            <p class="subtitle">Database Setup</p>
        </div>

        <div class="option-cards">
            <div class="option-card" onclick="createDatabase()">
                <div class="opt-icon">🆕</div>
                <h3>Create New Database</h3>
                <p>Start fresh with a new database file</p>
            </div>
            <div class="option-card" onclick="connectDatabase()">
                <div class="opt-icon">📂</div>
                <h3>Connect Existing</h3>
                <p>Connect to an existing database</p>
            </div>
        </div>

        <div class="result-box" id="resultBox"></div>

        <div class="divider">or</div>

        <button class="btn btn-outline" onclick="loadLastConfig()">
            📋 Use Last Configuration
        </button>

        <div class="existing-path" id="existingPath" style="display:none;"></div>
    </div>

    <script src="frameworkdb.js"></script>
    <script>
        const resultBox = document.getElementById('resultBox');
        const existingPathDiv = document.getElementById('existingPath');

        function showResult(message, type = 'info') {
            resultBox.textContent = message;
            resultBox.className = 'result-box show ' + type;
            setTimeout(() => {
                resultBox.classList.remove('show');
            }, 8000);
        }

        async function createDatabase() {
            showResult('⏳ Opening folder dialog...', 'info');

            try {
                const result = await window.frameworkAPI.createDatabase();

                if (result === 'Cancelled') {
                    showResult('⚠️ Operation cancelled by user.', 'info');
                    return;
                }

                if (result && result.includes('Database Created')) {
                    showResult('✅ ' + result, 'success');
                    // Auto redirect to project after 1.5 seconds
                    setTimeout(() => {
                        window.location.href = 'Project/index.html';
                    }, 1500);
                } else {
                    showResult('✅ ' + result, 'success');
                    setTimeout(() => {
                        window.location.href = 'Project/index.html';
                    }, 1500);
                }
            } catch (error) {
                showResult('❌ Error: ' + (error.message || error), 'error');
            }
        }

        async function connectDatabase() {
            showResult('⏳ Opening file dialog to select existing database...', 'info');

            try {
                const result = await window.frameworkAPI.connectDatabase();

                if (result === 'Cancelled') {
                    showResult('⚠️ Operation cancelled by user.', 'info');
                    return;
                }

                if (result && result.includes('Connected')) {
                    showResult('✅ ' + result, 'success');
                    setTimeout(() => {
                        window.location.href = 'Project/index.html';
                    }, 1500);
                } else if (result && result.includes('Invalid')) {
                    showResult('❌ ' + result, 'error');
                } else {
                    showResult('✅ Database connected successfully!', 'success');
                    setTimeout(() => {
                        window.location.href = 'Project/index.html';
                    }, 1500);
                }
            } catch (error) {
                showResult('❌ Error: ' + (error.message || error), 'error');
            }
        }

        async function loadLastConfig() {
            showResult('⏳ Loading last configuration...', 'info');

            try {
                const config = await window.frameworkAPI.getConfig();

                if (config && config.databasePath) {
                    existingPathDiv.style.display = 'block';
                    existingPathDiv.innerHTML = `
                        <strong>📁 Last Database:</strong><br>
                        ${config.databasePath}
                    `;

                    // Try to connect
                    const result = await window.frameworkAPI.loadExistingDatabase();

                    if (result && result.success) {
                        showResult('✅ Connected to existing database! Redirecting...', 'success');
                        setTimeout(() => {
                            window.location.href = 'Project/index.html';
                        }, 1500);
                    } else {
                        showResult('⚠️ Could not connect to last database. Please create or connect manually.', 'info');
                    }
                } else {
                    showResult('⚠️ No previous configuration found. Please create or connect a database.', 'info');
                }
            } catch (error) {
                showResult('❌ Error: ' + (error.message || error), 'error');
            }
        }

        // Check if config already exists on load
        (async function() {
            try {
                const config = await window.frameworkAPI.getConfig();
                if (config && config.databasePath) {
                    existingPathDiv.style.display = 'block';
                    existingPathDiv.innerHTML = `
                        <strong>📁 Existing Database Found:</strong><br>
                        ${config.databasePath}
                    `;
                }
            } catch (e) {
                // No config exists yet
            }
        })();
    </script>

</body>
</html>
