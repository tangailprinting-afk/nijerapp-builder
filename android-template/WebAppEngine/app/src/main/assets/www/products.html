<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Management | Rizq Restaurant</title>
    <script src="common.js"></script>
    <style>
        :root {
            --primary:#6366f1; --primary-dark:#4f46e5; --bg:#f8fafc; --card-bg:#fff; --text:#0f172a; --text-secondary:#64748b; --text-muted:#94a3b8;
            --border:#e2e8f0; --success:#10b981; --warning:#f59e0b; --danger:#ef4444; --shadow:0 1px 3px rgba(0,0,0,.06); --shadow-xl:0 20px 40px rgba(0,0,0,.08);
            --radius-sm:8px; --radius-lg:16px; --transition:all .2s ease;
        }
        *{box-sizing:border-box;margin:0;padding:0}
 body{font-family:'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
        .navbar{background:rgba(255,255,255,.85);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:0 24px;display:flex;align-items:center;justify-content:space-between;min-height:64px;position:sticky;top:0;z-index:50;gap:16px;flex-wrap:wrap}
        .navbar-brand{display:flex;align-items:center;gap:10px;text-decoration:none;flex-shrink:0}
        .navbar-brand img{width:38px;height:38px;border-radius:8px;object-fit:cover}
        .brand-icon-fallback{width:40px;height:40px;background:linear-gradient(135deg,#6366f1,#8b5cf6);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:20px}
        .brand-text{font-size:16px;font-weight:800;line-height:1.1}
        .brand-sub{font-size:9px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.8px}
        .navbar-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
        .btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;transition:var(--transition);border:none;font-family:inherit;text-decoration:none;white-space:nowrap}
        .btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:var(--primary-dark)}
        .btn-success{background:var(--success);color:#fff}.btn-danger{background:var(--danger);color:#fff}
        .btn-outline{background:#fff;color:var(--text);border:1.5px solid var(--border)}.btn-ghost{background:transparent;color:var(--text-secondary)}
        .btn-xs{padding:5px 10px;font-size:11px}.btn-sm{padding:6px 12px;font-size:12px}
        .main-container{max-width:1300px;margin:0 auto;padding:24px}
        .page-header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:24px}
        .page-header h1{font-size:26px;font-weight:800}.subtitle{font-size:13px;color:var(--text-secondary)}
        .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:24px}
        .stat-card{background:var(--card-bg);border-radius:var(--radius-lg);padding:18px 20px;box-shadow:var(--shadow)}
        .stat-label{font-size:11px;color:var(--text-secondary);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
        .stat-value{font-size:26px;font-weight:900}
        .card{background:var(--card-bg);border-radius:var(--radius-lg);box-shadow:var(--shadow);overflow:hidden;margin-bottom:20px}
        .card-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:#fafbfc}
        .card-header h3{font-size:14px;font-weight:700}.card-body{padding:20px}.card-body.no-padding{padding:0;overflow-x:auto}
        .search-box{display:flex;align-items:center;gap:6px;background:#f8fafc;border:1.5px solid var(--border);border-radius:25px;padding:0 16px}
        .search-box input{border:none;background:transparent;padding:9px 0;outline:none;font-size:13px;width:200px;font-family:inherit}
        .table-wrapper{overflow-x:auto}
        table{width:100%;border-collapse:collapse;font-size:12.5px} table thead{background:#f8fafc}
        table th{padding:11px 16px;text-align:left;font-weight:700;color:var(--text-secondary);font-size:10px;text-transform:uppercase;letter-spacing:.6px;border-bottom:1px solid var(--border)}
        table td{padding:11px 16px;border-bottom:1px solid #f1f5f9} table tbody tr:hover{background:#f8fafc}
        .amount{font-weight:700}.amount.green{color:var(--success)}.amount.orange{color:#f97316}.amount.red{color:var(--danger)}
        .badge{display:inline-flex;padding:4px 10px;border-radius:20px;font-size:10.5px;font-weight:700}
        .badge-info{background:#dbeafe;color:#1e40af}.badge-success{background:#d1fae5;color:#065f46}.badge-warning{background:#fef3c7;color:#92400e}
        .empty-state{text-align:center;padding:40px 20px;color:var(--text-muted)}
        .form-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
        .form-group{margin-bottom:12px}.form-group.full{grid-column:1/-1}
        .form-group label{display:block;margin-bottom:5px;font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-secondary)}
        .form-group input,.form-group select,.form-group textarea{width:100%;padding:10px 14px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit;outline:none;background:#fafbfc}
        .form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--primary);background:#fff;box-shadow:0 0 0 3px rgba(99,102,241,.06)}
        .product-entry{background:linear-gradient(135deg,#fafbfc 0%,#eff6ff 100%);border:2px dashed #3b82f6;border-radius:var(--radius-lg);padding:24px;margin-bottom:20px}
        .modal-overlay{display:none;position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:200;align-items:center;justify-content:center}
        .modal-overlay.show{display:flex}.modal{background:#fff;border-radius:16px;width:90%;max-width:760px;max-height:85vh;overflow-y:auto;box-shadow:var(--shadow-xl)}
        .modal-header{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#fff;z-index:1}
        .modal-body{padding:20px 22px}.modal-footer{padding:14px 22px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end}
        .btn-close{background:none;border:none;font-size:20px;cursor:pointer;color:var(--text-muted)}
        @media (max-width:768px){
            .navbar{padding:12px 16px}
            .navbar-actions{width:100%}
            .navbar-actions .btn{flex:1;justify-content:center}
            .main-container{padding:16px}
            .page-header{align-items:stretch}
            .page-header h1{font-size:22px}
            .page-header > .btn{width:100%;justify-content:center}
            .stats-grid{grid-template-columns:repeat(2,1fr)}
            .card-header{align-items:stretch}
            .card-header .search-box{width:100%}
            .card-header .search-box input{width:100%}
            .form-grid{grid-template-columns:1fr}
            .modal{width:95%;max-height:88vh}
            .modal-footer{flex-direction:column}
            .modal-footer .btn{width:100%;justify-content:center}
        }
        @media (max-width:480px){
            .stats-grid{grid-template-columns:1fr}
            .stat-card{padding:16px}
            .table-wrapper{margin:0 -2px}
            table{font-size:11px}
            table th, table td{padding:10px 10px}
            .card-body.no-padding{overflow-x:auto}
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="navbar-brand">
            <img src="image/logo.jpg" alt="Logo" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';" style="display:block;">
            <div class="brand-icon-fallback" style="display:none;">🖨️</div>
            <div><div class="brand-text">Rizq Restaurant</div><div class="brand-sub">Management System</div></div>
        </a>
        <div class="navbar-actions"></div>
    </nav>

    <div class="main-container">
        <div class="page-header">
            <div><h1>Menu Management</h1><p class="subtitle">Manage restaurant menu items with optional stock tracking</p></div>
            <button class="btn btn-primary" onclick="openAddModal()">➕ Add Menu Item</button>
        </div>

        <div class="stats-grid">
            <div class="stat-card"><div class="stat-label">Total Menu Items</div><div class="stat-value" id="statTotal">0</div></div>
            <div class="stat-card"><div class="stat-label">Stock Items</div><div class="stat-value" style="color:#3b82f6;" id="statStockItems">0</div></div>
            <div class="stat-card"><div class="stat-label">Low Stock</div><div class="stat-value" style="color:#f59e0b;" id="statLowStock">0</div></div>
            <div class="stat-card"><div class="stat-label">No Stock Data</div><div class="stat-value" style="color:#64748b;" id="statNoStock">0</div></div>
        </div>

        <div class="card">
            <div class="card-header">
                <h3>📋 Menu List</h3>
                <div class="search-box"><input type="text" id="searchInput" placeholder="Search..." onkeyup="updateTable()"></div>
            </div>
            <div class="card-body no-padding">
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th><th>Name</th><th>SKU</th><th>Category</th><th>Unit</th><th>Cost</th><th>Price</th><th>Stock</th><th>Status</th><th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="productTable"><tr><td colspan="10"><div class="empty-state"><p>Loading...</p></div></td></tr></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="productModal">
        <div class="modal">
            <div class="modal-header"><h3 id="modalTitle">➕ Add Menu Item</h3><button class="btn-close" onclick="closeModal()">✕</button></div>
            <form id="modalForm">
                <div class="modal-body">
                    <div class="form-grid">
                        <div class="form-group"><label>Menu Item Name *</label><input type="text" id="mp_name" required></div>
                        <div class="form-group"><label>SKU / Code</label><input type="text" id="mp_sku"></div>
                        <div class="form-group"><label>Category</label><input type="text" id="mp_category"></div>
                        <div class="form-group"><label>Unit</label><input type="text" id="mp_unit"></div>
                        <div class="form-group"><label>Cost Price</label><input type="number" id="mp_cost" step="0.01" min="0"></div>
                        <div class="form-group"><label>Selling Price</label><input type="number" id="mp_price" step="0.01" min="0"></div>
                        <div class="form-group"><label>Current Stock</label><input type="number" id="mp_stock" step="1" min="0"></div>
                        <div class="form-group"><label>Minimum Stock</label><input type="number" id="mp_minStock" step="1" min="0"></div>
                        <div class="form-group full"><label>Notes</label><textarea id="mp_notes" rows="2"></textarea></div>
                    </div>
                    <input type="hidden" id="mp_id" value="">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary">💾 Save</button>
                </div>
            </form>
        </div>
    </div>

    <script src="frameworkdb.js"></script>
    <script>
        let products = [], editingId = null;

        async function init() { await loadData(); resetModalForm(); }
        async function loadData() { try { products = ensureArray(await FrameworkDB.get('products')); updateAllUI(); } catch (e) { console.error(e); } }
        function resetModalForm() { ['mp_id','mp_name','mp_sku','mp_category','mp_unit','mp_cost','mp_price','mp_stock','mp_minStock','mp_notes'].forEach(id => { const el = document.getElementById(id); if (el) el.value = ''; }); }
        function openAddModal() { editingId = null; document.getElementById('modalTitle').textContent = '➕ Add Menu Item'; resetModalForm(); document.getElementById('productModal').classList.add('show'); }
        function closeModal() { document.getElementById('productModal').classList.remove('show'); editingId = null; }
        function getStockStatus(p) { const stock = p.current_stock; const min = parseFloat(p.min_stock || 0) || 0; if (stock === '' || stock === null || stock === undefined) return { label: 'Optional', cls: 'badge-info' }; const num = parseFloat(stock) || 0; if (min > 0 && num <= min) return { label: 'Low Stock', cls: 'badge-warning' }; return { label: 'In Stock', cls: 'badge-success' }; }
        function updateAllUI() { updateStats(); updateTable(); populateQuickSearch(); }
        function updateStats() {
            document.getElementById('statTotal').textContent = products.length;
            document.getElementById('statStockItems').textContent = products.filter(p => p.current_stock !== '' && p.current_stock !== null && p.current_stock !== undefined && String(p.current_stock).trim() !== '').length;
            document.getElementById('statLowStock').textContent = products.filter(p => { const stock = p.current_stock; const min = parseFloat(p.min_stock || 0) || 0; const num = parseFloat(stock); return Number.isFinite(num) && min > 0 && num <= min; }).length;
            document.getElementById('statNoStock').textContent = products.filter(p => p.current_stock === '' || p.current_stock === null || p.current_stock === undefined || String(p.current_stock).trim() === '').length;
        }
        function populateQuickSearch() {}
        function updateTable() {
            const tbody = document.getElementById('productTable');
            const s = (document.getElementById('searchInput')?.value || '').trim().toLowerCase();
            let list = [...products].sort((a,b) => {
                const ab = parseFloat(a.current_stock || 0) || 0;
                const bb = parseFloat(b.current_stock || 0) || 0;
                const amin = parseFloat(a.min_stock || 0) || 0;
                const bmin = parseFloat(b.min_stock || 0) || 0;
                if ((bb <= bmin) !== (ab <= amin)) return (bb <= bmin) ? 1 : -1;
                if (bb !== ab) return ab - bb;
                return (a.name || '').localeCompare(b.name || '');
            });
            if (s) list = list.filter(p => (p.name || '').toLowerCase().includes(s) || (p.sku || '').toLowerCase().includes(s) || (p.category || '').toLowerCase().includes(s));
            if (list.length === 0) { tbody.innerHTML = '<tr><td colspan="10"><div class="empty-state"><p>No menu items yet</p></div></td></tr>'; return; }
            tbody.innerHTML = list.map(p => {
                const stock = p.current_stock;
                const hasStock = !(stock === '' || stock === null || stock === undefined || String(stock).trim() === '');
                const status = hasStock ? getStockStatus(p) : { label: 'Optional', cls: 'badge-info' };
                const stockDisplay = hasStock ? `<span class="amount ${status.cls === 'badge-warning' ? 'orange' : 'green'}">${fmtCurrency(parseFloat(stock) || 0)}</span>` : '<span class="badge badge-info">Optional</span>';
                return `<tr>
                    <td>#${p.id}</td>
                    <td class="cname">${esc(p.name || '-')}</td>
                    <td>${esc(p.sku || '-')}</td>
                    <td>${esc(p.category || '-')}</td>
                    <td>${esc(p.unit || '-')}</td>
                    <td class="amount orange">${p.cost_price !== '' && p.cost_price !== null && p.cost_price !== undefined ? fmtCurrency(parseFloat(p.cost_price) || 0) : '-'}</td>
                    <td class="amount green">${p.selling_price !== '' && p.selling_price !== null && p.selling_price !== undefined ? fmtCurrency(parseFloat(p.selling_price) || 0) : '-'}</td>
                    <td>${stockDisplay}</td>
                    <td><span class="badge ${status.cls}">${status.label}</span></td>
                    <td>
                        <button class="btn btn-outline btn-xs" onclick="openEditModal(${p.id})">✏️</button>
                        <button class="btn btn-danger btn-xs" onclick="deleteProduct(${p.id})">🗑️</button>
                    </td>
                </tr>`;
            }).join('');
        }
        function openEditModal(id) {
            const p = products.find(x => x.id == id);
            if (!p) return;
            editingId = id;
            document.getElementById('modalTitle').textContent = '✏️ Edit Menu Item';
            document.getElementById('mp_id').value = id;
            document.getElementById('mp_name').value = p.name || '';
            document.getElementById('mp_sku').value = p.sku || '';
            document.getElementById('mp_category').value = p.category || '';
            document.getElementById('mp_unit').value = p.unit || '';
            document.getElementById('mp_cost').value = p.cost_price ?? '';
            document.getElementById('mp_price').value = p.selling_price ?? '';
            document.getElementById('mp_stock').value = p.current_stock ?? '';
            document.getElementById('mp_minStock').value = p.min_stock ?? '';
            document.getElementById('mp_notes').value = p.notes || '';
            document.getElementById('productModal').classList.add('show');
        }
        async function deleteProduct(id) { if (!confirm('Delete this menu item?')) return; try { await FrameworkDB.delete('products', id); showToast('🗑️ Deleted!'); await loadData(); } catch (err) { showToast('❌ ' + err.message, 'error'); } }

        document.getElementById('modalForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const data = {
                name: document.getElementById('mp_name').value.trim(),
                sku: document.getElementById('mp_sku').value.trim(),
                category: document.getElementById('mp_category').value.trim(),
                unit: document.getElementById('mp_unit').value.trim(),
                cost_price: document.getElementById('mp_cost').value === '' ? null : parseFloat(document.getElementById('mp_cost').value) || 0,
                selling_price: document.getElementById('mp_price').value === '' ? null : parseFloat(document.getElementById('mp_price').value) || 0,
                current_stock: document.getElementById('mp_stock').value === '' ? null : parseFloat(document.getElementById('mp_stock').value) || 0,
                min_stock: document.getElementById('mp_minStock').value === '' ? null : parseFloat(document.getElementById('mp_minStock').value) || 0,
                notes: document.getElementById('mp_notes').value.trim(),
                updatedAt: new Date().toISOString()
            };
            if (!data.name) { showToast('Enter menu item name', 'error'); return; }
            try {
                if (editingId) {
                    await FrameworkDB.update('products', editingId, data);
                    showToast('✅ Menu item updated!');
                } else {
                    data.createdAt = new Date().toISOString();
                    await FrameworkDB.save('products', data);
                    showToast('✅ Menu item saved!');
                }
                closeModal();
                resetModalForm();
                await loadData();
            } catch (err) { showToast('❌ ' + err.message, 'error'); }
        });

        document.querySelectorAll('.modal-overlay').forEach(o => o.addEventListener('click', function(e) { if (e.target === this) this.classList.remove('show'); }));
        document.addEventListener('keydown', function(e) { if (e.key === 'Escape') document.querySelectorAll('.modal-overlay.show').forEach(m => m.classList.remove('show')); });
        init();
    </script>
</body>
</html>
