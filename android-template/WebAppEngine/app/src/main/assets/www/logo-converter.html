<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Logo to Base64 Converter</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; padding: 20px; max-width: 800px; margin: 0 auto; }
        h2 { color: #6366f1; }
        .box { border: 2px dashed #ccc; padding: 30px; text-align: center; cursor: pointer; border-radius: 12px; margin: 10px 0; }
        .box:hover { border-color: #6366f1; background: #f8f8ff; }
        img { max-width: 200px; max-height: 80px; margin: 10px 0; }
        textarea { width: 100%; height: 300px; font-size: 11px; font-family: monospace; padding: 10px; border: 1px solid #ccc; border-radius: 8px; margin-top: 10px; }
        .btn { padding: 12px 24px; background: #6366f1; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; margin: 5px; }
        .btn:hover { background: #4f46e5; }
        .success { color: #10b981; font-weight: 600; }
    </style>
</head>
<body>
    <h2>🖼️ Logo to Base64 Converter</h2>
    <p>আপনার <strong>logo.jpg</strong> ফাইলটি সিলেক্ট করুন। এটি Base64 কোড জেনারেট করবে যা সব পেজে ব্যবহার করা যাবে।</p>
    
    <div class="box" id="dropZone" onclick="document.getElementById('fileInput').click()">
        <p>📁 <strong>Click here to select logo image</strong></p>
        <p style="font-size:12px;color:#888;">or drag & drop</p>
        <img id="preview" style="display:none;">
    </div>
    <input type="file" id="fileInput" accept="image/*" style="display:none;" onchange="handleFile(event)">
    
    <textarea id="output" readonly placeholder="Base64 code will appear here..."></textarea>
    
    <button class="btn" onclick="copyCode()">📋 Copy Code</button>
    <button class="btn" onclick="saveToFile()">💾 Save as logo-base64.txt</button>
    <span id="copyMsg" class="success" style="display:none;">✅ Copied!</span>

    <script>
        function handleFile(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            // Preview
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('preview').src = e.target.result;
                document.getElementById('preview').style.display = 'block';
                document.getElementById('output').value = e.target.result;
            };
            reader.readAsDataURL(file);
        }
        
        // Drag & Drop
        const dropZone = document.getElementById('dropZone');
        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.style.borderColor = '#6366f1'; });
        dropZone.addEventListener('dragleave', () => { dropZone.style.borderColor = '#ccc'; });
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.style.borderColor = '#ccc';
            const file = e.dataTransfer.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(ev) {
                    document.getElementById('preview').src = ev.target.result;
                    document.getElementById('preview').style.display = 'block';
                    document.getElementById('output').value = ev.target.result;
                };
                reader.readAsDataURL(file);
            }
        });
        
        function copyCode() {
            const output = document.getElementById('output');
            output.select();
            document.execCommand('copy');
            document.getElementById('copyMsg').style.display = 'inline';
            setTimeout(() => document.getElementById('copyMsg').style.display = 'none', 2000);
        }
        
        function saveToFile() {
            const content = document.getElementById('output').value;
            const blob = new Blob([content], {type: 'text/plain'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'logo-base64.txt';
            a.click();
        }
    </script>
</body>
</html>
