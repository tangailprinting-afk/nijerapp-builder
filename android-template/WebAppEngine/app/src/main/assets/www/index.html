<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আমার বায়ো | My Single Page Bio</title>
    <style>
        /* CSS রিসেট এবং গ্লোবাল স্টাইল */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* বায়ো কার্ড স্টাইল */
        .bio-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 40px 30px;
            border-radius: 20px;
            width: 100%;
            max-width: 450px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        /* প্রোফাইল ছবি */
        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #00adb5;
            margin-bottom: 20px;
            box-shadow: 0 0 20px rgba(0, 173, 181, 0.5);
        }

        /* নাম ও পদবী */
        h1 {
            font-size: 1.8rem;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        p.tagline {
            color: #00adb5;
            font-size: 1rem;
            margin-bottom: 25px;
            font-weight: 500;
        }

        /* সোশ্যাল ও কাজের লিঙ্কসমূহ */
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
        }

        .bio-link {
            background: rgba(255, 255, 255, 0.2);
            color: #ffffff;
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: bold;
            transition: all 0.3s ease;
            border: 1px solid transparent;
        }

        .bio-link:hover {
            background: #00adb5;
            color: #111;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 173, 181, 0.4);
        }

        /* ডার্ক/লাইট মোড বাটন স্টাইল */
        .theme-btn {
            background: transparent;
            border: 2px solid #ffffff;
            color: #ffffff;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: 0.3s;
        }

        .theme-btn:hover {
            background: #ffffff;
            color: #111;
        }

        /* লাইট মোড থিম (JavaScript এর জন্য) */
        body.light-mode {
            background: linear-gradient(135deg, #e0eafc, #cfdef3);
            color: #333333;
        }
        body.light-mode .bio-card {
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(0, 0, 0, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.1);
        }
        body.light-mode .bio-link {
            background: rgba(0, 0, 0, 0.05);
            color: #333333;
        }
        body.light-mode .bio-link:hover {
            background: #00adb5;
            color: #ffffff;
        }
        body.light-mode .theme-btn {
            border-color: #333333;
            color: #333333;
        }
        body.light-mode .theme-btn:hover {
            background: #333333;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="bio-card">
        <!-- প্রোফাইল ছবি (আপনার ছবির লিঙ্ক এখানে দিন) -->
        <img src="https://via.placeholder.com/150" alt="Profile Picture" class="profile-img">

        <!-- আপনার নাম এবং ছোট পরিচয় -->
        <h1>আপনার নাম এখানে</h1>
        <p class="tagline">ওয়েব ডেভেলপার ও ডিজাইনার</p>

        <!-- সোশ্যাল মিডিয়া ও গুরুত্বপূর্ণ লিঙ্কসমূহ -->
        <div class="links-container">
            <a href="https://yourportfolio.com" target="_blank" class="bio-link">🌐 আমার পোর্টফোলিও</a>
            <a href="https://github.com" target="_blank" class="bio-link">🐙 গিটহাব (GitHub)</a>
            <a href="https://linkedin.com" target="_blank" class="bio-link">💼 লিঙ্কডইন (LinkedIn)</a>
            <a href="https://facebook.com" target="_blank" class="bio-link">📘 ফেসবুক (Facebook)</a>
            <a href="mailto:your-email@example.com" class="bio-link">✉️ ইমেইল করুন</a>
        </div>

        <!-- ইন্টারঅ্যাক্টিভ জাভাস্ক্রিপ্ট বাটন (থিম পরিবর্তন) -->
        <button class="theme-btn" id="themeToggle">থিম পরিবর্তন করুন</button>
    </div>

    <!-- জাভাস্ক্রিপ্ট কোড -->
    <script>
        const themeToggleBtn = document.getElementById('themeToggle');
        
        themeToggleBtn.addEventListener('click', () => {
            // বডিতে লাইট-মোড ক্লাস যোগ বা বাদ দেওয়া
            document.body.classList.toggle('light-mode');
            
            // বাটনের টেক্সট পরিবর্তন
            if(document.body.classList.contains('light-mode')) {
                themeToggleBtn.textContent = "ডার্ক মোড করুন";
            } else {
                themeToggleBtn.textContent = "থিম পরিবর্তন করুন";
            }
        });
    </script>

</body>
</html>
