<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Naim's Ultra Swipe Gallery</title>
    <style>
        :root {
            --primary: #3b82f6;
            --surface: #0f172a;
            --glass: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.1);
            --text: #f8fafc;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        body {
            background-color: var(--surface);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow-x: hidden;
            user-select: none;
        }

        #welcomePopup {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: radial-gradient(circle at top right, #1e293b, #020617);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: transform 0.8s cubic-bezier(0.85, 0, 0.15, 1);
        }

        #welcomePopup.hidden { transform: translateY(-100%); }

        .welcome-content { text-align: center; padding: 2rem; max-width: 400px; }

        .welcome-logo {
            width: 140px;
            height: 140px;
            border-radius: 40px;
            object-fit: cover;
            border: 4px solid var(--primary);
            box-shadow: 0 0 50px rgba(59, 130, 246, 0.3);
            margin-bottom: 2rem;
            animation: floating 3s ease-in-out infinite;
        }

        @keyframes floating {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }

        .lyric {
            font-size: 1.4rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 2.5rem;
            line-height: 1.4;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        .btn-start {
            background: var(--primary);
            color: white;
            padding: 1.2rem 3rem;
            border: none;
            border-radius: 20px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.4);
            transition: 0.3s;
        }

        .main-app { padding: 1rem; opacity: 0; transition: opacity 1s; }
        .main-app.visible { opacity: 1; }

        .header { padding: 2rem 1rem; text-align: center; }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            max-width: 900px;
            margin: 0 auto;
        }

        .card {
            aspect-ratio: 1;
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            opacity: 0;
            transition: transform 0.6s, opacity 0.6s;
        }

        .card.loaded { opacity: 1; }

        .card img { width: 100%; height: 100%; object-fit: cover; }

        #lightbox {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 10000;
            display: none;
            overflow: hidden;
            touch-action: none;
        }

        #lightbox.active { display: flex; flex-direction: column; }

        .lb-header {
            position: absolute;
            top: 20px;
            width: 100%;
            padding: 0 20px;
            display: flex;
            justify-content: flex-end;
            z-index: 10002;
        }

        .icon-btn {
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            color: white;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            margin-left: 10px;
        }

        .lb-image-container {
            flex: 1;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        #lbImg {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            transition: transform 0.1s ease-out;
            will-change: transform;
        }

        .lb-footer {
            position: absolute;
            bottom: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            z-index: 10002;
            pointer-events: none;
        }

        .counter {
            background: rgba(255,255,255,0.1);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            backdrop-filter: blur(10px);
            pointer-events: auto;
        }

        .zoom-badge {
            margin-top: 10px;
            background: var(--primary);
            padding: 2px 10px;
            border-radius: 10px;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0;
            transition: 0.3s;
        }

        .zoom-badge.visible { opacity: 1; }

        /* SVG Icons */
        .svg-icon { width: 24px; height: 24px; fill: currentColor; }

        @media (max-width: 480px) {
            .gallery-grid { grid-template-columns: repeat(3, 1fr); gap: 4px; }
        }
    </style>
</head>
<body>

    <div id="welcomePopup">
        <div class="welcome-content">
            <img src="image/logo.png" class="welcome-logo" alt="Logo" onerror="this.src='https://placehold.co/150/1e293b/white?text=♪'">
            <div class="lyric">
                "হৃদয় জুড়ে তুমি আছো,<br>স্বপ্ন হয়ে ভালোবাসো..."
            </div>
            <button class="btn-start" onclick="startApp()">Gallery দেখুন</button>
        </div>
    </div>

    <div class="main-app" id="mainApp">
        <header class="header">
            <h1 style="font-size: 1.6rem;">Naim's Premium Gallery</h1>
            <p style="color: #64748b; font-size: 0.8rem; margin-top: 5px;">সুইপ করুন অথবা জুম করুন</p>
        </header>

        <div class="gallery-grid" id="grid">
            <!-- Images generated by JS -->
        </div>
    </div>

    <div id="lightbox">
        <div class="lb-header">
            <div class="icon-btn" onclick="resetZoom()" id="resetBtn" style="display: none;">
                <svg class="svg-icon" viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg>
            </div>
            <div class="icon-btn" onclick="closeLightbox()" style="color: #ff4757;">
                <svg class="svg-icon" viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
            </div>
        </div>

        <div class="lb-image-container" id="zoomContainer">
            <img src="" id="lbImg">
        </div>

        <div class="lb-footer">
            <div class="counter" id="counter">1 / 23</div>
            <div class="zoom-badge" id="zoomBadge">Zoom Active</div>
        </div>
    </div>

    <script>
        const totalImages = 23;
        const grid = document.getElementById('grid');
        const mainApp = document.getElementById('mainApp');
        const lightbox = document.getElementById('lightbox');
        const lbImg = document.getElementById('lbImg');
        const counter = document.getElementById('counter');
        const zoomBadge = document.getElementById('zoomBadge');
        const resetBtn = document.getElementById('resetBtn');
        
        let currentIndex = 1;
        
        // Zoom and Pan State
        let scale = 1;
        let lastScale = 1;
        let initialDistance = null;
        let isZoomed = false;

        // Swipe State
        let touchStartX = 0;
        let touchEndX = 0;

        function startApp() {
            document.getElementById('welcomePopup').classList.add('hidden');
            mainApp.classList.add('visible');
            loadGrid();
        }

        function loadGrid() {
            for (let i = 1; i <= totalImages; i++) {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `<img src="image/${i}.png" loading="lazy" onerror="this.src='https://placehold.co/300x300/1e293b/64748b?text=Image+${i}'">`;
                card.onclick = () => openLightbox(i);
                grid.appendChild(card);
                // Staggered animation
                setTimeout(() => card.classList.add('loaded'), i * 50);
            }
        }

        function openLightbox(index) {
            currentIndex = index;
            lightbox.style.display = 'flex';
            setTimeout(() => lightbox.classList.add('active'), 10);
            updateLightbox();
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            lightbox.classList.remove('active');
            setTimeout(() => {
                lightbox.style.display = 'none';
                resetZoom();
            }, 300);
            document.body.style.overflow = 'auto';
        }

        function updateLightbox() {
            resetZoom();
            lbImg.src = `image/${currentIndex}.png`;
            counter.textContent = `${currentIndex} / ${totalImages}`;
        }

        function changeImage(step) {
            if (scale > 1.1) return; // Disable swipe when zoomed
            currentIndex += step;
            if (currentIndex > totalImages) currentIndex = 1;
            if (currentIndex < 1) currentIndex = totalImages;
            updateLightbox();
        }

        lightbox.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                touchStartX = e.touches[0].clientX;
            } else if (e.touches.length === 2) {
                // Initial distance for pinch
                initialDistance = Math.hypot(
                    e.touches[0].pageX - e.touches[1].pageX,
                    e.touches[0].pageY - e.touches[1].pageY
                );
            }
        }, { passive: false });

        lightbox.addEventListener('touchmove', (e) => {
            if (e.touches.length === 2) {
                e.preventDefault(); // Stop page scrolling
                const currentDist = Math.hypot(
                    e.touches[0].pageX - e.touches[1].pageX,
                    e.touches[0].pageY - e.touches[1].pageY
                );
                
                if (initialDistance) {
                    scale = lastScale * (currentDist / initialDistance);
                    scale = Math.min(Math.max(1, scale), 4); // Min 1x, Max 4x
                    applyTransform();
                }
            }
        }, { passive: false });

        lightbox.addEventListener('touchend', (e) => {
            if (e.touches.length < 2) {
                initialDistance = null;
                lastScale = scale;
                checkZoomState();
            }

            if (e.touches.length === 0) {
                touchEndX = e.changedTouches[0].clientX;
                handleSwipe();
            }
        }, { passive: false });

        function handleSwipe() {
            if (scale > 1.1) return; // Don't swipe if zoomed
            const diff = touchStartX - touchEndX;
            if (Math.abs(diff) > 60) {
                if (diff > 0) changeImage(1);  // Left Swipe -> Next
                else changeImage(-1);          // Right Swipe -> Prev
            }
        }

        function checkZoomState() {
            if (scale > 1.1) {
                isZoomed = true;
                zoomBadge.classList.add('visible');
                resetBtn.style.display = 'flex';
            } else {
                scale = 1;
                lastScale = 1;
                isZoomed = false;
                zoomBadge.classList.remove('visible');
                resetBtn.style.display = 'none';
                applyTransform();
            }
        }

        function applyTransform() {
            lbImg.style.transform = `scale(${scale})`;
        }

        function resetZoom() {
            scale = 1;
            lastScale = 1;
            applyTransform();
            checkZoomState();
        }

        let lastTap = 0;
        lightbox.addEventListener('click', (e) => {
            const now = Date.now();
            if (now - lastTap < 300) {
                // Double tap logic
                if (scale > 1.1) resetZoom();
                else {
                    scale = 2.5;
                    lastScale = 2.5;
                    applyTransform();
                    checkZoomState();
                }
            }
            lastTap = now;
        });

        document.addEventListener('keydown', (e) => {
            if (!lightbox.classList.contains('active')) return;
            if (e.key === 'ArrowRight') changeImage(1);
            if (e.key === 'ArrowLeft') changeImage(-1);
            if (e.key === 'Escape') closeLightbox();
        });

    </script>
</body>
</html>
