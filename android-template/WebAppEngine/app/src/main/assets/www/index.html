<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0f172a,#1e3a8a,#2563eb);
    overflow:hidden;
}

.container{
    width:90%;
    max-width:380px;
    text-align:center;
    color:#fff;
}

.logo{
    width:110px;
    height:110px;
    margin:auto;
    border-radius:28px;
    background:rgba(255,255,255,.15);
    backdrop-filter:blur(10px);
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:48px;
    margin-bottom:25px;
    box-shadow:0 15px 40px rgba(0,0,0,.25);
}

h1{
    font-size:32px;
    margin-bottom:10px;
}

p{
    font-size:16px;
    color:#dbeafe;
    line-height:1.6;
    margin-bottom:40px;
}

.btn{
    display:inline-block;
    width:100%;
    padding:18px;
    border-radius:16px;
    background:#fff;
    color:#2563eb;
    text-decoration:none;
    font-size:18px;
    font-weight:bold;
    transition:.3s;
    box-shadow:0 10px 30px rgba(0,0,0,.25);
}

.btn:hover{
    transform:translateY(-3px);
}

.footer{
    margin-top:30px;
    font-size:13px;
    color:#cbd5e1;
}
</style>

</head>
<body>

<div class="container">

    <div class="logo">🍽️</div>

    <h1>Welcome</h1>

    <p>
        Welcome to Rizq Restaurant.<br>
        Order delicious food quickly and easily.
    </p>

    <a class="btn" href="https://rizqreastaurant.pages.dev/admin">
        Get Started →
    </a>

    <div class="footer">
        © 2026 Rizq Restaurant
    </div>

</div>

</body>
</html>
