<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Naim's Premium Gallery</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --accent-color: #38bdf8;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-light: #f8fafc;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-light);
            overflow-x: hidden;
            line-height: 1.6;
        }

        #welcomePopup {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 5000;
            transition: transform 0.8s cubic-bezier(0.87, 0, 0.13, 1);
        }

        #welcomePopup.hidden {
            transform: translateY(-100%);
        }

        .welcome-content {
            text-align: center;
            padding: 40px;
            max-width: 450px;
            width: 90%;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 32px;
            backdrop-filter: blur(20px);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .welcome-img {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--accent-color);
            padding: 5px;
            margin-bottom: 24px;
            filter: drop-shadow(0 0 15px rgba(56, 189, 248, 0.3));
        }

        .welcome-text {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 30px;
            background: linear-gradient(to right, #f8fafc, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .btn-start {
            background-color: var(--accent-color);
            color: #000;
            border: none;
            padding: 16px 40px;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 10px 20px -5px rgba(56, 189, 248, 0.4);
            width: 100%;
        }

        .btn-start:active {
            transform: scale(0.96);
        }

        .main-content {
            opacity: 0;
            transition: opacity 0.5s ease;
            padding-bottom: 50px;
        }

        .main-content.visible {
            opacity: 1;
        }

        header {
            padding: 60px 20px 30px;
            text-align: center;
        }

        header h1 {
            font-size: 2.2rem;
            letter-spacing: -1px;
            margin-bottom: 10px;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            padding: 0 12px;
            max-width: 900px;
            margin: 0 auto;
        }

        .gallery-card {
            position: relative;
            aspect-ratio: 1/1;
            border-radius: 16px;
            overflow: hidden;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            cursor: pointer;
        }

        .gallery-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .gallery-card:hover img {
            transform: scale(1.08);
        }

        #lightbox {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.98);
            z-index: 6000;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #lightbox.active {
            display: flex;
        }

        .lightbox-container {
            position: relative;
            width: 100%;
            height: 80vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #lightboxImg {
            max-width: 95%;
            max-height: 100%;
            border-radius: 12px;
            box-shadow: 0 0 40px rgba(0,0,0,0.5);
            object-fit: contain;
        }

        .close-btn {
            position: absolute;
            top: 25px;
            right: 25px;
            font-size: 40px;
            color: #fff;
            cursor: pointer;
            z-index: 6010;
        }

        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.05);
            border: none;
            color: white;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
            backdrop-filter: blur(5px);
        }

        .nav-btn:active { background: rgba(255, 255, 255, 0.2); }
        .prev-btn { left: 15px; }
        .next-btn { right: 15px; }

        .counter {
            color: rgba(255, 255, 255, 0.5);
            margin-top: 20px;
            font-size: 0.9rem;
            letter-spacing: 2px;
        }

        /* Responsive Breakpoints */
        @media (max-width: 480px) {
            header h1 { font-size: 1.8rem; }
            .gallery-grid { grid-template-columns: repeat(3, 1fr); gap: 8px; }
            .nav-btn { width: 50px; height: 50px; }
        }
    </style>
</head>
<body>

    <div id="welcomePopup">
        <div class="welcome-content">
            <img src="image/logo.png" alt="Welcome" class="welcome-img" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'140\' height=\'140\'><rect width=\'100%\' height=\'100%\' fill=\'%231e293b\'/><text x=\'50%\' y=\'50%\' font-size=\'40\' fill=\'white\' text-anchor=\'middle\' dominant-baseline=\'middle\'>♪</text></svg>'">
            <div class="welcome-text">
                "হৃদয় জুড়ে তুমি আছো,<br>স্বপ্ন হয়ে ভালোবাসো..."
            </div>
            <button class="btn-start" onclick="startGallery()">Get Started</button>
        </div>
    </div>

    <div class="main-content" id="mainContent">
        <header>
            <h1>My Collection</h1>
            <div style="width: 50px; hieght: 2px; background: var(--accent-color); margin: 0 auto; height: 3px; border-radius: 5px;"></div>
        </header>

        <div class="gallery-grid" id="grid">
            <!-- Images will be injected here by JS -->
        </div>
    </div>

    <div id="lightbox">
        <span class="close-btn" onclick="closeLightbox()">&times;</span>
        <div class="lightbox-container">
            <button class="nav-btn prev-btn" onclick="changeImage(-1)">&#10094;</button>
            <img src="" id="lightboxImg" alt="View">
            <button class="nav-btn next-btn" onclick="changeImage(1)">&#10095;</button>
        </div>
        <div class="counter" id="imgCounter">1 / 23</div>
    </div>

    <script>
        const totalImages = 23;
        const grid = document.getElementById('grid');
        const mainContent = document.getElementById('mainContent');
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightboxImg');
        const imgCounter = document.getElementById('imgCounter');

        let currentIndex = 1;

        // গ্যালারী শুরু করার ফাংশন
        function startGallery() {
            document.getElementById('welcomePopup').classList.add('hidden');
            mainContent.classList.add('visible');
            document.body.style.overflow = 'auto';
        }

        // শুরুতে স্ক্রল বন্ধ রাখা
        document.body.style.overflow = 'hidden';

        // ১ থেকে ২৩ পর্যন্ত ইমেজ জেনারেট করা
        for (let i = 1; i <= totalImages; i++) {
            const card = document.createElement('div');
            card.className = 'gallery-card';
            card.innerHTML = `
                <img src="image/${i}.png" alt="Memory ${i}" loading="lazy" 
                     onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'100\' height=\'100\'><rect width=\'100%\' height=\'100%\' fill=\'%231e293b\'/><text x=\'50%\' y=\'50%\' font-size=\'10\' fill=\'%2364748b\' text-anchor=\'middle\'>Image ${i}</text></svg>'">
            `;
            card.onclick = () => openLightbox(i);
            grid.appendChild(card);
        }

        function openLightbox(index) {
            currentIndex = index;
            lightbox.classList.add('active');
            updateLightbox();
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            lightbox.classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        function updateLightbox() {
            lightboxImg.src = `image/${currentIndex}.png`;
            imgCounter.textContent = `${currentIndex} / ${totalImages}`;
        }

        function changeImage(step) {
            currentIndex += step;
            if (currentIndex > totalImages) currentIndex = 1;
            if (currentIndex < 1) currentIndex = totalImages;
            updateLightbox();
        }

        // কিবোর্ড সাপোর্ট
        document.addEventListener('keydown', (e) => {
            if (!lightbox.classList.contains('active')) return;
            if (e.key === 'ArrowRight') changeImage(1);
            if (e.key === 'ArrowLeft') changeImage(-1);
            if (e.key === 'Escape') closeLightbox();
        });

        // ইমেজের বাইরে ক্লিক করলে লাইটবক্স বন্ধ হবে
        lightbox.addEventListener('click', (e) => {
            if (e.target === lightbox || e.target.classList.contains('lightbox-container')) {
                closeLightbox();
            }
        });
    </script>
</body>
</html>
