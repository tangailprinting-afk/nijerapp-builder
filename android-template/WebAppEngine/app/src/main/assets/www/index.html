<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>গণিত শিক্ষক AI (অফলাইন)</title>
    <!-- MathJax for beautiful math rendering -->
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f4f9; }
        #chat-box { height: 300px; background: white; border: 1px solid #ccc; overflow-y: scroll; padding: 10px; margin-bottom: 10px; }
        textarea { width: 100%; height: 80px; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>

    <h2>প্রফেশনাল গণিত শিক্ষক AI</h2>
    <div id="chat-box">সিস্টেম রেডি হচ্ছে... অনুগ্রহ করে অপেক্ষা করুন।</div>
    <textarea id="userInput" placeholder="আপনার গণিত সমস্যাটি এখানে লিখুন..."></textarea><br><br>
    <button onclick="askAI()">সমাধান করুন</button>

    <script type="module">
        import { CreateMLCEngine } from "https://esm.run/@mlc-ai/web-llm";

        const chatBox = document.getElementById('chat-box');
        const model = "Qwen2.5-Math-1.5B-Instruct-q4f16_1"; // হালকা মডেল যাতে ফোনে দ্রুত চলে
        
        const engine = await CreateMLCEngine(model, {
            initProgressCallback: (report) => {
                chatBox.innerText = report.text;
            }
        });

        window.askAI = async () => {
            const input = document.getElementById('userInput').value;
            chatBox.innerHTML += `<p><b>ছাত্র:</b> ${input}</p>`;
            
            const reply = await engine.chat.completions.create({
                messages: [
                    { role: "system", content: "তুমি একজন প্রফেশনাল গণিত শিক্ষক। বাংলা ভাষায় ধাপে ধাপে গণিত সমাধান করো।" },
                    { role: "user", content: input }
                ]
            });

            const answer = reply.choices[0].message.content;
            chatBox.innerHTML += `<p><b>শিক্ষক:</b> ${answer}</p>`;
            MathJax.typeset(); // MathJax রেন্ডার করার জন্য
        };
    </script>
</body>
</html>
