<!DOCTYPE html>
<html lang="bn">

<head>

  <!-- ========================= -->
  <!-- META -->
  <!-- ========================= -->

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="
      width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no
    "
  >

  <title>

    Bengali AI Math Teacher

  </title>

  <!-- ========================= -->
  <!-- CSS -->
  <!-- ========================= -->

  <link
    rel="stylesheet"
    href="./assets/css/main.css"
  >

  <link
    rel="stylesheet"
    href="./assets/css/chat.css"
  >

  <link
    rel="stylesheet"
    href="./assets/css/mobile.css"
  >

  <link
    rel="stylesheet"
    href="./assets/css/markdown.css"
  >

  <link
    rel="stylesheet"
    href="./assets/css/graph.css"
  >

  <link
    rel="stylesheet"
    href="./assets/css/animations.css"
  >

  <!-- ========================= -->
  <!-- KATEX -->
  <!-- ========================= -->

<link
rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css"
>
<!-- KaTeX CSS -->

<link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css"
/>

<!-- KaTeX JS -->

<script
  defer
  src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"
></script>

<script
  defer
  src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"
></script>


</head>

<body>

  <!-- APP -->

  <div class="app">

    <!-- ===================== -->
    <!-- SIDEBAR -->
    <!-- ===================== -->

    <aside class="sidebar">

      <div class="sidebar-top">

        <button id="newChatBtn">

          + New Chat

        </button>

      </div>

      <div class="chat-history">

        <div class="history-item">

          📘 গণিত চ্যাট

        </div>

      </div>

    </aside>

    <!-- ===================== -->
    <!-- MAIN -->
    <!-- ===================== -->

    <main class="main">

      <!-- ================= -->
      <!-- TOPBAR -->
      <!-- ================= -->

      <header class="topbar">

        <div class="logo">

          🧠 Bengali AI Math Teacher

        </div>

      </header>

      <!-- ================= -->
      <!-- CHAT -->
      <!-- ================= -->

      <section
        id="chatMessages"
        class="chat-messages"
      >

        <!-- WELCOME -->

        <div class="message ai-message">

          <div class="message-content">

            <h2>
              👋 আসসালামু আলাইকুম
            </h2>

            <p>
              আমি আপনার বাংলা AI গণিত শিক্ষক।
            </p>

            <p>
              আপনি গণিতের যেকোন প্রশ্ন করতে পারেন।
            </p>

          </div>

        </div>

      </section>

<!-- ========================= -->
<!-- GRAPH AREA -->
<!-- ========================= -->

<section
  id="graphSection"
  class="graph-section"
>

  <canvas
    id="graphCanvas"
  ></canvas>

</section>

      <!-- ================= -->
      <!-- INPUT -->
      <!-- ================= -->

      <footer class="input-area">

        <textarea
          id="userInput"
          placeholder="
গণিতের প্রশ্ন লিখুন...
"
        ></textarea>

        <button id="sendBtn">

          ➤

        </button>

      </footer>

    </main>

  </div>

  <!-- ========================= -->
  <!-- LIBRARIES -->
  <!-- ========================= -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/12.4.1/math.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>


  <!-- ========================= -->
  <!-- APP -->
  <!-- ========================= -->

  <script
    type="module"
    src="./assets/js/app.js"
  ></script>

</body>
</html>
