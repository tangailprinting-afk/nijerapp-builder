<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title> Scientific</title>
    <style>
        :root {
            /* Default Dark Theme Variables */
            --bg-color: #0f172a;
            --calc-bg: #1e293b;
            --display-bg: #0f172a;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --accent: #3b82f6;
            --btn-num: #334155;
            --btn-op: #475569;
            --btn-sci: #1e293b;
            --btn-equal: #2563eb;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            --ripple: rgba(255, 255, 255, 0.2);
            --radius: 16px;
        }

        [data-theme="light"] {
            --bg-color: #f1f5f9;
            --calc-bg: #ffffff;
            --display-bg: #f8fafc;
            --text-main: #1e293b;
            --text-dim: #64748b;
            --accent: #2563eb;
            --btn-num: #f1f5f9;
            --btn-op: #e2e8f0;
            --btn-sci: #f8fafc;
            --btn-equal: #2563eb;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --ripple: rgba(0, 0, 0, 0.1);
        }

        [data-theme="amoled"] {
            --bg-color: #000000;
            --calc-bg: #000000;
            --display-bg: #000000;
            --text-main: #ffffff;
            --text-dim: #888888;
            --accent: #3b82f6;
            --btn-num: #111111;
            --btn-op: #222222;
            --btn-sci: #0a0a0a;
            --btn-equal: #2563eb;
            --shadow: none;
            --ripple: rgba(255, 255, 255, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            transition: background-color 0.3s ease;
        }

        .app-container {
            width: 100%;
            max-width: 450px;
            height: 100vh;
            max-height: 900px;
            background-color: var(--calc-bg);
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        /* Header Section */
        .header {
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .header-title {
            font-weight: 700;
            font-size: 1.2rem;
            color: var(--accent);
        }

        .header-tools {
            display: flex;
            gap: 15px;
        }

        .icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 5px;
            color: var(--text-dim);
            transition: color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-btn:active { color: var(--accent); }

        /* Display Section */
        .display {
            flex: 1;
            background-color: var(--display-bg);
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: flex-end;
            overflow: hidden;
            position: relative;
        }

        .history-preview {
            font-size: 1.1rem;
            color: var(--text-dim);
            margin-bottom: 8px;
            white-space: nowrap;
            overflow-x: auto;
            width: 100%;
            text-align: right;
            scrollbar-width: none;
        }

        .current-input {
            font-size: 3rem;
            font-weight: 600;
            word-wrap: break-word;
            word-break: break-all;
            max-height: 150px;
            overflow-y: auto;
            width: 100%;
            text-align: right;
            line-height: 1.1;
            scrollbar-width: none;
        }

        .mode-indicator {
            position: absolute;
            top: 10px;
            left: 20px;
            font-size: 0.7rem;
            font-weight: 800;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Keypad Section */
        .keypad {
            padding: 10px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            background-color: var(--calc-bg);
        }

        .scientific-drawer {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            padding: 0 10px 10px 10px;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1), padding 0.3s;
        }

        .scientific-drawer.open {
            max-height: 300px;
            padding: 10px;
        }

        /* Buttons Styling */
        .btn {
            height: 65px;
            border-radius: var(--radius);
            border: none;
            outline: none;
            font-size: 1.3rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            transition: transform 0.1s, background-color 0.2s;
            color: var(--text-main);
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn-num { background-color: var(--btn-num); }
        .btn-op { background-color: var(--btn-op); color: var(--accent); font-weight: 600; }
        .btn-sci { background-color: var(--btn-sci); font-size: 1rem; color: var(--text-dim); }
        .btn-eq { background-color: var(--btn-equal); color: white; grid-column: span 1; }
        .btn-ac { color: #ef4444; }

        .btn-wide { grid-column: span 2; }

        /* Ripple Effect */
        .ripple {
            position: absolute;
            background: var(--ripple);
            border-radius: 50%;
            transform: scale(0);
            animation: ripple-animation 0.6s linear;
            pointer-events: none;
        }

        @keyframes ripple-animation {
            to { transform: scale(4); opacity: 0; }
        }

        /* History Drawer */
        .history-panel {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 70%;
            background-color: var(--calc-bg);
            border-radius: 24px 24px 0 0;
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 100;
            display: flex;
            flex-direction: column;
            box-shadow: 0 -10px 25px rgba(0,0,0,0.5);
        }

        .history-panel.open { transform: translateY(0); }

        .history-header {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--btn-sci);
        }

        .history-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px 20px;
        }

        .history-item {
            padding: 15px 0;
            border-bottom: 1px solid var(--btn-sci);
            text-align: right;
            cursor: pointer;
        }

        .history-item .h-expr { color: var(--text-dim); font-size: 0.9rem; }
        .history-item .h-res { color: var(--accent); font-size: 1.2rem; font-weight: 600; margin-top: 4px; }

        /* Toast Notifications */
        .toast {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: var(--accent);
            color: white;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 0.9rem;
            transition: transform 0.3s;
            z-index: 1000;
        }

        .toast.show { transform: translateX(-50%) translateY(0); }

        /* SVG Icons defined as classes to avoid external calls */
        .icon { width: 24px; height: 24px; fill: currentColor; }
        
        @media (min-width: 600px) {
            .app-container {
                height: 800px;
                border-radius: 32px;
            }
        }
    </style>
</head>
<body data-theme="dark">

    <div class="app-container">
        <header class="header">
            <div class="header-title">Scientific</div>
            <div class="header-tools">
                <button class="icon-btn" id="theme-toggle" title="Switch Theme">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58a.996.996 0 00-1.41 0 .996.996 0 000 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37a.996.996 0 00-1.41 0 .996.996 0 000 1.41l1.06 1.06c.39.39 1.03.39 1.41 0a.996.996 0 000-1.41l-1.06-1.06zm1.06-10.96a.996.996 0 000-1.41.996.996 0 00-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36a.996.996 0 000-1.41.996.996 0 00-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/></svg>
                </button>
                <button class="icon-btn" id="history-toggle" title="View History">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M13 3c-4.97 0-9 4.03-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42C8.27 19.99 10.51 21 13 21c4.97 0 9-4.03 9-9s-4.03-9-9-9zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg>
                </button>
            </div>
        </header>

        <div class="display" id="main-display">
            <div class="mode-indicator" id="mode-display">DEG</div>
            <div class="history-preview" id="history-preview"></div>
            <div class="current-input" id="result-display">0</div>
        </div>

        <div class="scientific-drawer" id="sci-panel">
            <button class="btn btn-sci" data-val="sin">sin</button>
            <button class="btn btn-sci" data-val="cos">cos</button>
            <button class="btn btn-sci" data-val="tan">tan</button>
            <button class="btn btn-sci" data-val="asin">asin</button>
            <button class="btn btn-sci" data-val="acos">acos</button>
            <button class="btn btn-sci" data-val="log">log</button>
            <button class="btn btn-sci" data-val="ln">ln</button>
            <button class="btn btn-sci" data-val="sqrt">√</button>
            <button class="btn btn-sci" data-val="abs">abs</button>
            <button class="btn btn-sci" data-val="fact">n!</button>
            <button class="btn btn-sci" data-val="pow">xʸ</button>
            <button class="btn btn-sci" data-val="e">e</button>
            <button class="btn btn-sci" data-val="pi">π</button>
            <button class="btn btn-sci" data-val="(">(</button>
            <button class="btn btn-sci" data-val=")">)</button>
        </div>

        <div class="keypad">
            <button class="btn btn-sci" id="toggle-sci">2nd</button>
            <button class="btn btn-sci" id="toggle-mode">DEG/RAD</button>
            <button class="btn btn-sci" data-val="mem-c">MC</button>

            <button class="btn btn-op btn-ac" id="btn-clear">AC</button>

            </button>
            <button class="btn btn-op" data-val="%">%</button>
            <button class="btn btn-op" data-val="/">÷</button>

            <button class="btn btn-num" data-val="7">7</button>
            <button class="btn btn-num" data-val="8">8</button>
            <button class="btn btn-num" data-val="9">9</button>
            <button class="btn btn-op" data-val="*">×</button>

            <button class="btn btn-num" data-val="4">4</button>
            <button class="btn btn-num" data-val="5">5</button>
            <button class="btn btn-num" data-val="6">6</button>
            <button class="btn btn-op" data-val="-">−</button>

            <button class="btn btn-num" data-val="1">1</button>
            <button class="btn btn-num" data-val="2">2</button>
            <button class="btn btn-num" data-val="3">3</button>
            <button class="btn btn-op" data-val="+">+</button>

            <button class="btn btn-num" data-val="0">0</button>
            <button class="btn btn-num" data-val=".">.</button>
            <button class="btn btn-num" id="copy-result" title="Copy">
                <svg class="icon" viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
            </button>
            <button class="btn btn-eq" id="btn-equals">=</button>
        </div>

        <div class="history-panel" id="history-panel">
            <div class="history-header">
                <span style="font-weight: bold;">History</span>
                <button class="icon-btn" id="clear-history-btn" style="color: #ef4444; font-size: 0.8rem;">CLEAR ALL</button>
            </div>
            <div class="history-list" id="history-list">
                <!-- History items will be injected here -->
            </div>
        </div>

        <div class="toast" id="toast">Copied to clipboard!</div>
    </div>

    <script>
        /* 
         * Application State 
         */
        const state = {
            expression: '',
            lastResult: '0',
            isCalculated: false,
            angleMode: localStorage.getItem('calc-mode') || 'DEG',
            theme: localStorage.getItem('calc-theme') || 'dark',
            memory: parseFloat(localStorage.getItem('calc-memory')) || 0,
            history: JSON.parse(localStorage.getItem('calc-history')) || []
        };

        // DOM Elements
        const displayEl = document.getElementById('result-display');
        const historyPreviewEl = document.getElementById('history-preview');
        const modeEl = document.getElementById('mode-display');
        const sciPanel = document.getElementById('sci-panel');
        const historyPanel = document.getElementById('history-panel');
        const historyList = document.getElementById('history-list');
        const toast = document.getElementById('toast');

        /* 
         * Core Logic: Math Engine 
         */
        const MathEngine = {
            evaluate: (expr, mode) => {
                try {
                    // Sanitize input
                    let sanitized = expr
                        .replace(/×/g, '*')
                        .replace(/÷/g, '/')
                        .replace(/−/g, '-')
                        .replace(/π/g, 'Math.PI')
                        .replace(/e/g, 'Math.E');

                    // Handle Scientific Functions
                    // Wrap trig and other functions with Math.
                    const functions = ['sin', 'cos', 'tan', 'asin', 'acos', 'atan', 'log', 'sqrt', 'abs'];
                    functions.forEach(f => {
                        const regex = new RegExp(`${f}\\(`, 'g');
                        sanitized = sanitized.replace(regex, `MathEngine.wrapFunc('${f}',`);
                    });

                    // Handle natural log (ln)
                    sanitized = sanitized.replace(/ln\(/g, 'Math.log(');
                    
                    // Handle power x^y
                    sanitized = sanitized.replace(/(\d+(\.\d+)?|\))pow(\d+(\.\d+)?|\()/g, 'Math.pow($1,$3)');

                    // Safety check: only allow math characters
                    if (/[^0-9\+\-\*\/\.\(\), Math\.PIEsqrtlogabscotan\^]/.test(sanitized)) {
                        throw new Error('Invalid Character');
                    }

                    // Simple Factorial replacement (manual parsing needed for true factorial but we'll do 1-level)
                    // Simplified: replaces 5! with fact(5)
                    sanitized = sanitized.replace(/(\d+)!/g, 'MathEngine.factorial($1)');

                    // Final eval logic (using Function constructor for performance/scope control)
                    const result = new Function(`return ${sanitized}`)();
                    
                    if (!isFinite(result)) return "Error";
                    return Number(result.toFixed(10)).toString();
                } catch (e) {
                    console.error(e);
                    return "Error";
                }
            },

            wrapFunc: (name, val) => {
                if (['sin', 'cos', 'tan'].includes(name)) {
                    // Adjust for Degree mode if necessary
                    const angle = state.angleMode === 'DEG' ? (val * Math.PI) / 180 : val;
                    return Math[name](angle);
                }
                if (['asin', 'acos', 'atan'].includes(name)) {
                    const res = Math[name](val);
                    return state.angleMode === 'DEG' ? (res * 180) / Math.PI : res;
                }
                if (name === 'log') return Math.log10(val);
                return Math[name](val);
            },

            factorial: (n) => {
                if (n < 0) return NaN;
                if (n === 0 || n === 1) return 1;
                let res = 1;
                for (let i = 2; i <= n; i++) res *= i;
                return res;
            }
        };

        /* 
         * UI Interactions 
         */
        function updateUI() {
            // Scroll displays to end
            displayEl.innerText = state.expression || '0';
            historyPreviewEl.innerText = state.isCalculated ? '' : state.lastResult;
            modeEl.innerText = state.angleMode;
            document.body.setAttribute('data-theme', state.theme);
            
            // Auto scroll to right
            displayEl.scrollLeft = displayEl.scrollWidth;
        }

        function handleInput(val) {
            if (state.isCalculated) {
                // If starting a new expression after result
                if (/[0-9]/.test(val) || val.includes('(') || ['sin', 'cos', 'tan', 'log', 'ln', 'sqrt', 'abs', 'pi', 'e'].includes(val)) {
                    state.expression = '';
                } else {
                    state.expression = state.lastResult;
                }
                state.isCalculated = false;
            }

            switch(val) {
                case 'delete':
                    state.expression = state.expression.slice(0, -1);
                    break;
                case 'pow':
                    state.expression += 'pow';
                    break;
                case 'fact':
                    state.expression += '!';
                    break;
                case 'pi': state.expression += 'π'; break;
                case 'e': state.expression += 'e'; break;
                case 'mem-c': state.memory = 0; showToast("Memory Cleared"); break;
                case 'mem-r': state.expression += state.memory.toString(); break;
                case 'sin': case 'cos': case 'tan': case 'asin': case 'acos': 
                case 'log': case 'ln': case 'sqrt': case 'abs':
                    state.expression += val + '(';
                    break;
                default:
                    state.expression += val;
            }
            updateUI();
        }

        function calculate() {
            if (!state.expression) return;
            const res = MathEngine.evaluate(state.expression, state.angleMode);
            
            if (res !== "Error") {
                // Save to history
                const entry = { expr: state.expression, res: res, id: Date.now() };
                state.history.unshift(entry);
                if (state.history.length > 50) state.history.pop();
                localStorage.setItem('calc-history', JSON.stringify(state.history));
                renderHistory();
            }

            state.lastResult = res;
            state.expression = res;
            state.isCalculated = true;
            updateUI();
        }

        // Ripple logic
        function createRipple(event) {
            const btn = event.currentTarget;
            const circle = document.createElement("span");
            const diameter = Math.max(btn.clientWidth, btn.clientHeight);
            const radius = diameter / 2;

            const rect = btn.getBoundingClientRect();
            circle.style.width = circle.style.height = `${diameter}px`;
            circle.style.left = `${event.clientX - rect.left - radius}px`;
            circle.style.top = `${event.clientY - rect.top - radius}px`;
            circle.classList.add("ripple");

            const ripple = btn.getElementsByClassName("ripple")[0];
            if (ripple) ripple.remove();
            btn.appendChild(circle);
        }

        /* 
         * Event Listeners 
         */
        document.querySelectorAll('.btn').forEach(btn => {
            btn.addEventListener('pointerdown', (e) => {
                createRipple(e);
                const val = btn.getAttribute('data-val');
                if (val) handleInput(val);
            });
        });

        document.getElementById('btn-clear').addEventListener('click', () => {
            state.expression = '';
            state.lastResult = '0';
            state.isCalculated = false;
            updateUI();
        });

        // Long press AC to clear history
        let acTimer;
        document.getElementById('btn-clear').addEventListener('pointerdown', () => {
            acTimer = setTimeout(() => {
                state.history = [];
                localStorage.setItem('calc-history', '[]');
                renderHistory();
                showToast("History wiped");
            }, 800);
        });
        document.getElementById('btn-clear').addEventListener('pointerup', () => clearTimeout(acTimer));

        document.getElementById('btn-equals').addEventListener('click', calculate);

        document.getElementById('toggle-sci').addEventListener('click', () => {
            sciPanel.classList.toggle('open');
        });

        document.getElementById('toggle-mode').addEventListener('click', () => {
            state.angleMode = state.angleMode === 'DEG' ? 'RAD' : 'DEG';
            localStorage.setItem('calc-mode', state.angleMode);
            updateUI();
        });

        document.getElementById('theme-toggle').addEventListener('click', () => {
            const themes = ['dark', 'light', 'amoled'];
            let idx = themes.indexOf(state.theme);
            state.theme = themes[(idx + 1) % themes.length];
            localStorage.setItem('calc-theme', state.theme);
            updateUI();
        });

        document.getElementById('history-toggle').addEventListener('click', () => {
            historyPanel.classList.toggle('open');
        });

        document.getElementById('clear-history-btn').addEventListener('click', () => {
            state.history = [];
            localStorage.setItem('calc-history', '[]');
            renderHistory();
        });

        document.getElementById('copy-result').addEventListener('click', () => {
            const text = displayEl.innerText;
            const el = document.createElement('textarea');
            el.value = text;
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);
            showToast("Copied result");
        });

        function renderHistory() {
            historyList.innerHTML = state.history.length ? '' : '<div style="text-align:center; padding: 40px; color: var(--text-dim);">No history yet</div>';
            state.history.forEach(item => {
                const div = document.createElement('div');
                div.className = 'history-item';
                div.innerHTML = `
                    <div class="h-expr">${item.expr}</div>
                    <div class="h-res">${item.res}</div>
                `;
                div.onclick = () => {
                    state.expression = item.res;
                    state.isCalculated = true;
                    updateUI();
                    historyPanel.classList.remove('open');
                };
                historyList.appendChild(div);
            });
        }

        function showToast(msg) {
            toast.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        /* 
         * Keyboard Support 
         */
        window.addEventListener('keydown', (e) => {
            if (e.key >= '0' && e.key <= '9') handleInput(e.key);
            if (['+', '-', '*', '/', '.', '(', ')', '%'].includes(e.key)) handleInput(e.key);
            if (e.key === 'Enter') calculate();
            if (e.key === 'Backspace') handleInput('delete');
            if (e.key === 'Escape') {
                state.expression = '';
                updateUI();
            }
        });

        // Prevent zoom on double tap for iOS
        document.addEventListener('touchstart', (e) => {
            if (e.touches.length > 1) e.preventDefault();
        }, { passive: false });

        // Initialize App
        window.onload = () => {
            updateUI();
            renderHistory();
            // Start with scientific panel closed for mobile simplicity
        };
    </script>
</body>
</html>
