    <style>
        :root {

            --surface: #141419;
            --surface2: #1a1a22;
            --surface3: #1f1f28;
            --text: #e8e8f0;
            --text2: #b0b0be;
            --text3: #7a7a8c;
            --accent: #6c5ce7;
            --accent2: #a29bfe;

        .theme-light {

            --surface: #ffffff;
            --surface2: #f5f5fa;
            --surface3: #eaeaef;
            --text: #1a1a2e;
            --text2: #555570;
            --text3: #8888a0;
            --border: rgba(0,0,0,0.08);
            --shadow: 0 8px 32px rgba(0,0,0,0.1);
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.06);
            --glass: rgba(255,255,255,0.75);

            --surface2: #111111;
            --surface3: #181818;
            --text: #f0f0f0;
            --text2: #aaa;
            --text3: #666;
            --border: rgba(255,255,255,0.04);
            --shadow: 0 8px 32px rgba(0,0,0,0.6);
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.5);
            --glass: rgba(10,10,10,0.85);
            --glass2: rgba(18,18,18,0.75);

        *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
        html{font-size:16px;scroll-behavior:smooth;height:100%;overflow:hidden;}
        body{font-family:var(--font);background:var(--bg);color:var(--text);height:100%;overflow:hidden;display:flex;flex-direction:column;transition:background var(--transition),color var(--transition);}
        body.bn{font-family:var(--font-bn);}
        ::-webkit-scrollbar{width:4px;height:4px;}

        .search-bar input{background:none;border:none;color:var(--text);font-size:0.85rem;width:100%;outline:none;font-family:inherit;}

        .search-bar:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(108,92,231,0.15);}
        .main-container{display:flex;flex:1;overflow:hidden;position:relative;}
        .sidebar{width:240px;background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-right:1px solid var(--border);padding:6px;overflow-y:auto;flex-shrink:0;display:flex;flex-direction:column;gap:1px;transition:all var(--transition);z-index:50;}
        .sidebar-category{padding:9px 12px;border-radius:var(--radius-xs);cursor:pointer;font-size:0.8rem;font-weight:500;color:var(--text2);transition:all var(--transition);display:flex;align-items:center;gap:7px;white-space:nowrap;}

        .calc-card:hover{transform:translateY(-3px);box-shadow:var(--shadow);}
        .calc-card:active{transform:scale(0.97);}
        .calc-card .card-icon{font-size:1.7rem;width:44px;height:44px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;}
        .calc-card .card-label{font-size:0.72rem;font-weight:500;color:var(--text2);line-height:1.2;}
        .calculator-view{display:none;flex-direction:column;gap:10px;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px;box-shadow:var(--shadow);max-width:620px;margin:0 auto;width:100%;}

        .calc-display{background:var(--surface2);border-radius:var(--radius);padding:14px 18px;text-align:right;font-family:var(--font-mono);font-size:1.6rem;font-weight:300;min-height:58px;display:flex;align-items:flex-end;justify-content:flex-end;word-break:break-all;border:1px solid var(--border);overflow-x:auto;}

        .calc-btn{padding:12px 6px;border-radius:var(--radius-xs);border:none;font-size:0.9rem;font-weight:500;cursor:pointer;background:var(--surface2);color:var(--text);transition:all var(--transition);font-family:inherit;min-height:44px;display:flex;align-items:center;justify-content:center;}

        .action-btn{padding:9px 18px;border-radius:22px;border:none;cursor:pointer;font-weight:600;font-size:0.8rem;transition:all var(--transition);font-family:inherit;background:var(--accent);color:#fff;white-space:nowrap;}

        .action-btn:active{transform:scale(0.95);}
        .action-btn.secondary{background:var(--surface3);color:var(--text);}
        .bottom-nav{display:none;background:var(--glass);backdrop-filter:blur(20px);border-top:1px solid var(--border);padding:5px 6px;gap:2px;flex-shrink:0;z-index:100;justify-content:space-around;}
        .bottom-nav .nav-item{display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 8px;border-radius:10px;cursor:pointer;font-size:0.6rem;color:var(--text3);transition:all var(--transition);border:none;background:none;font-family:inherit;min-width:44px;}
        .bottom-nav .nav-item.active{color:var(--accent);background:var(--surface2);}
        .bottom-nav .nav-item .nav-icon{font-size:1.1rem;}
        .history-item{padding:7px 10px;background:var(--surface2);border-radius:var(--radius-xs);font-size:0.75rem;cursor:pointer;transition:all var(--transition);display:flex;justify-content:space-between;align-items:center;font-family:var(--font-mono);border:1px solid var(--border);}
        .history-item:hover{background:var(--surface3);}
        canvas{border-radius:var(--radius);background:var(--surface2);border:1px solid var(--border);touch-action:none;}
        .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:150;}
        .overlay.show{display:block;}
        .toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--surface3);color:var(--text);padding:9px 18px;border-radius:22px;font-size:0.8rem;z-index:300;animation:fadeInUp 0.3s ease;box-shadow:var(--shadow);pointer-events:none;font-family:inherit;}
        .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:250;align-items:center;justify-content:center;}
        .modal-overlay.show{display:flex;}
        .modal{background:var(--surface);border-radius:var(--radius-lg);padding:20px;max-width:500px;width:90%;max-height:80vh;overflow-y:auto;box-shadow:var(--shadow);border:1px solid var(--border);animation:fadeInUp 0.3s ease;}
        .modal h3{margin-bottom:12px;color:var(--accent2);}
        .modal .lang-select{display:flex;gap:8px;margin:10px 0;}
        .modal .lang-select button{flex:1;padding:10px;border-radius:var(--radius-xs);border:2px solid var(--border);background:var(--surface2);color:var(--text);cursor:pointer;font-family:inherit;font-weight:600;transition:all var(--transition);}
        .modal .lang-select button.active{border-color:var(--accent);background:var(--accent3);color:#fff;}
        .modal .close-btn{float:right;background:none;border:none;color:var(--text);font-size:1.3rem;cursor:pointer;}
        @media(max-width:768px){

            .bottom-nav{display:flex;}
            .dashboard-grid{grid-template-columns:repeat(auto-fill,minmax(95px,1fr));gap:6px;}
            .calc-card{padding:10px 6px;}
            .calc-card .card-icon{width:34px;height:34px;font-size:1.3rem;}
            .calc-card .card-label{font-size:0.62rem;}
            .app-header{padding:6px 10px;}
            .app-logo{font-size:0.95rem;}
            .search-bar{max-width:180px;}
            .calc-btn{padding:10px 4px;font-size:0.78rem;min-height:38px;}
            .calc-display{font-size:1.2rem;min-height:46px;}
        }
        @keyframes slideIn{from{transform:translateX(-100%);}to{transform:translateX(0);}}
    </style>
</head>

let currentLang = localStorage.getItem('calchub_lang') || 'bn';
function t(key){ return (T[currentLang] && T[currentLang][key]) || (T['en'][key]) || key; }
function applyLanguage(){
    document.body.className = currentLang==='bn'?'bn':'';
    document.documentElement.lang = currentLang;
    document.getElementById('appLogo').textContent = t('appName');
    document.getElementById('searchInput').placeholder = t('searchPlaceholder');
    document.getElementById('settingsTitle').textContent = t('settingsTitle');
    document.getElementById('settingsLangLabel').textContent = t('settingsLangLabel');
    document.getElementById('settingsNote').textContent = t('settingsNote');
    document.getElementById('langBn').classList.toggle('active', currentLang==='bn');
    document.getElementById('langEn').classList.toggle('active', currentLang==='en');
    document.querySelectorAll('[data-key]').forEach(el=>{ const key=el.getAttribute('data-key'); if(key) el.textContent=t(key); });
    updateGuideContent();
    renderDashboard(); renderRecent();
    closeCalculator();
}
window._setLang = function(lang){ currentLang=lang; localStorage.setItem('calchub_lang',lang); applyLanguage(); document.getElementById('settingsModal').classList.remove('show'); };

    const guideText = document.getElementById('guideText');

function getCalcName(c){ return currentLang==='bn'? (c.nameBn||c.nameEn) : (c.nameEn||c.nameBn); }

// ==================== DOM ====================
const $=(s)=>document.querySelector(s);
const dashboardGrid=$('#dashboardGrid'), favoritesGrid=$('#favoritesGrid'), recentList=$('#recentList');
const calculatorContainer=$('#calculatorContainer'), dashboardView=$('#dashboardView');
const searchInput=$('#searchInput'), sidebar=$('#sidebar'), overlay=$('#overlay');
const btnTheme=$('#btnTheme'), toastContainer=$('#toastContainer');

function applyTheme(th){
    document.body.classList.remove('theme-light','theme-amoled');
    if(th==='light') document.body.classList.add('theme-light');
    if(th==='amoled') document.body.classList.add('theme-amoled');
    STATE.theme=th; localStorage.setItem('calchub_theme',th);
    btnTheme.textContent=th==='dark'?'🌙':th==='light'?'☀️':'🖤';
}
applyTheme(STATE.theme);
btnTheme.addEventListener('click',()=>{ const c={dark:'light',light:'amoled',amoled:'dark'}; applyTheme(c[STATE.theme]||'dark'); });

function showToast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; toastContainer.appendChild(t); setTimeout(()=>t.remove(),2000); }
function saveState(){ localStorage.setItem('calchub_favorites',JSON.stringify(STATE.favorites)); localStorage.setItem('calchub_history',JSON.stringify(STATE.history.slice(0,50))); localStorage.setItem('calchub_recent',JSON.stringify(STATE.recentCalc.slice(0,20))); }
function addRecent(id){ STATE.recentCalc=STATE.recentCalc.filter(c=>c.id!==id); const calc=CALCULATORS.find(c=>c.id===id); if(calc) STATE.recentCalc.unshift({id,name:getCalcName(calc),time:Date.now()}); saveState(); renderRecent(); }
function toggleFavorite(id){ if(STATE.favorites.includes(id)) STATE.favorites=STATE.favorites.filter(f=>f!==id); else STATE.favorites.push(id); saveState(); renderDashboard(); showToast(STATE.favorites.includes(id)?t('toast_fav_added'):t('toast_fav_removed')); }
function addHistory(calcId,expr,result){ STATE.history.unshift({calcId,expression:expr,result,time:Date.now()}); saveState(); }

function renderDashboard(filter='all',search=''){
    let filtered=CALCULATORS;
    if(filter!=='all') filtered=filtered.filter(c=>c.cat===filter);
    if(search){ const s=search.toLowerCase(); filtered=filtered.filter(c=>getCalcName(c).toLowerCase().includes(s)); }
    dashboardGrid.innerHTML=filtered.map(c=>`<div class="calc-card${STATE.favorites.includes(c.id)?' favorite':''}" data-calc="${c.id}"><div class="card-icon">${c.icon}</div><div class="card-label">${getCalcName(c)}</div></div>`).join('')||`<p style="color:var(--text3);text-align:center;grid-column:1/-1;">${t('no_calc')}</p>`;
    const favCalcs=CALCULATORS.filter(c=>STATE.favorites.includes(c.id));
    favoritesGrid.innerHTML=favCalcs.map(c=>`<div class="calc-card favorite" data-calc="${c.id}"><div class="card-icon">${c.icon}</div><div class="card-label">${getCalcName(c)}</div></div>`).join('')||`<p style="color:var(--text3);text-align:center;grid-column:1/-1;">${t('no_fav')}</p>`;
    dashboardGrid.querySelectorAll('.calc-card').forEach(card=>{ card.onclick=()=>openCalculator(card.dataset.calc); card.oncontextmenu=e=>{e.preventDefault();toggleFavorite(card.dataset.calc);}; });
    favoritesGrid.querySelectorAll('.calc-card').forEach(card=>{ card.onclick=()=>openCalculator(card.dataset.calc); });
}
function renderRecent(){
    recentList.innerHTML=STATE.recentCalc.slice(0,8).map(r=>`<div class="history-item" data-calc="${r.id}" style="cursor:pointer;"><span>${r.name}</span><span style="color:var(--text3);font-size:0.65rem;">${new Date(r.time).toLocaleDateString()}</span></div>`).join('')||`<p style="color:var(--text3);">${t('no_recent')}</p>`;
    recentList.querySelectorAll('.history-item').forEach(item=>{ item.onclick=()=>openCalculator(item.dataset.calc); });
}

function openCalculator(calcId){
    STATE.currentCalc=calcId; STATE.currentView='calculator';
    dashboardView.style.display='none'; calculatorContainer.innerHTML='';
    const calc=CALCULATORS.find(c=>c.id===calcId); if(!calc) return;
    addRecent(calcId);
    const view=document.createElement('div'); view.className='calculator-view active'; view.id='calcView-'+calcId;
    view.innerHTML=getCalculatorHTML(calcId);
    calculatorContainer.appendChild(view); calculatorContainer.style.display='block';
    initCalculatorLogic(calcId,view);
    if(window.innerWidth<=768){sidebar.classList.remove('open');overlay.classList.remove('show');}
    document.getElementById('contentArea').scrollTop=0;
}
function closeCalculator(){
    STATE.currentView='dashboard'; STATE.currentCalc=null;
    dashboardView.style.display='block'; calculatorContainer.style.display='none'; calculatorContainer.innerHTML='';
    renderDashboard(); renderRecent();
}

function initBasicCalc(view){
    const d=view.querySelector('#basicDisplay'), btns=view.querySelector('#basicButtons'), hDiv=view.querySelector('#basicHistory');
    let cur='0',expr='',rst=false;
    const b=[['C','clear'],['⌫','func'],['%','func'],['÷','operator'],['7',''],['8',''],['9',''],['×','operator'],['4',''],['5',''],['6',''],['−','operator'],['1',''],['2',''],['3',''],['+','operator'],['±','func'],['0',''],['.',''],['=','equals']];
    btns.innerHTML=b.map(([l,c])=>`<button class="calc-btn ${c}">${l}</button>`).join('');
    const upd=()=>{d.textContent=expr||cur||'0';};
    const calc=e=>{try{let r=Function('"use strict";return ('+e.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-')+')')(); return isFinite(r)?parseFloat(r.toPrecision(12)):'Error';}catch{return'Error';}};
    btns.querySelectorAll('.calc-btn').forEach(btn=>{btn.onclick=()=>{
        const l=btn.textContent;
        if(l==='C'){cur='0';expr='';rst=false;}else if(l==='⌫'){expr?expr=expr.slice(0,-1)||'0':cur=cur.slice(0,-1)||'0';}
        else if(l==='='){const f=expr||cur;const r=calc(f);addHistory('basic',f+' = '+r,r);cur=String(r);expr='';rst=true;renderBasicHist();}
        else if(l==='%'){expr?expr+='/100':cur=String(parseFloat(cur)/100);}
        else if(l==='±'){if(expr){const m=expr.match(/(-?[\d.]+)$/);if(m)expr=expr.slice(0,-m[1].length)+String(-parseFloat(m[1]));}else cur=String(-parseFloat(cur));}
        else if(['+','−','×','÷'].includes(l)){rst=false;expr=(expr||cur)+l;cur='0';}
        else{if(rst){cur='0';expr='';rst=false;}cur==='0'&&l!=='.'?cur=l:cur+=l;}
        upd();
    };});
    function renderBasicHist(){const h=STATE.history.filter(h=>h.calcId==='basic').slice(0,8);hDiv.innerHTML=h.map(it=>`<div class="history-item" onclick="navigator.clipboard.writeText('${it.result}').then(()=>showToast('${t('toast_copied')}'))"><span>${it.expression}</span><span style="color:var(--green);">${it.result}</span></div>`).join('');}
    renderBasicHist(); upd();
}
function initScientificCalc(view){
    const d=view.querySelector('#sciDisplay'), btns=view.querySelector('#sciButtons');
    let cur='0',expr='',rst=false;
    const b=[['sin','func'],['cos','func'],['tan','func'],['log','func'],['ln','func'],['asin','func'],['acos','func'],['atan','func'],['√','func'],['x²','func'],['π','func'],['e','func'],['(','func'],[')','func'],['^','operator'],['7',''],['8',''],['9',''],['÷','operator'],['C','clear'],['4',''],['5',''],['6',''],['×','operator'],['⌫','func'],['1',''],['2',''],['3',''],['−','operator'],['n!','func'],['±','func'],['0',''],['.',''],['+','operator'],['=','equals']];

    const upd=()=>{d.textContent=expr||cur||'0';};
    const sciCalc=e=>{try{let s=e.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/\^/g,'**');s=s.replace(/sin\(/g,'Math.sin((').replace(/cos\(/g,'Math.cos((').replace(/tan\(/g,'Math.tan((');s=s.replace(/asin\(/g,'Math.asin((').replace(/acos\(/g,'Math.acos((').replace(/atan\(/g,'Math.atan((');s=s.replace(/log\(/g,'Math.log10((').replace(/ln\(/g,'Math.log((').replace(/√\(/g,'Math.sqrt((').replace(/π/g,'Math.PI');s=s.replace(/(\d+)!/g,'(function f(n){return n<=1?1:n*f(n-1)})($1)');let fixed='',depth=0;for(let i=0;i<s.length;i++){if(s[i]==='('&&i>=4&&s.substring(i-4,i)==='ath.'){fixed+='(';depth++;}else if(s[i]===')'&&depth>0&&s[i-1]!==')'){fixed+='))';depth--;}else fixed+=s[i];}if(STATE.degMode){fixed=fixed.replace(/Math\.sin\(\(([^)]+)\)\)/g,'Math.sin(($1)*Math.PI/180)');fixed=fixed.replace(/Math\.cos\(\(([^)]+)\)\)/g,'Math.cos(($1)*Math.PI/180)');fixed=fixed.replace(/Math\.tan\(\(([^)]+)\)\)/g,'Math.tan(($1)*Math.PI/180)');}let r=Function('"use strict";return ('+fixed+')')();return isFinite(r)&&!isNaN(r)?parseFloat(r.toPrecision(12)):'Error';}catch{return'Error';}};
    btns.querySelectorAll('.calc-btn').forEach(btn=>{btn.onclick=()=>{
        const l=btn.textContent;
        if(l==='C'){cur='0';expr='';rst=false;}else if(l==='⌫'){expr?expr=expr.slice(0,-1)||'0':cur=cur.slice(0,-1)||'0';}
        else if(l==='='){const f=expr||cur;const r=sciCalc(f);addHistory('scientific',f+' = '+r,r);cur=String(r);expr='';rst=true;}
        else if(['sin','cos','tan','asin','acos','atan','log','ln'].includes(l)){expr=(expr||cur)+l+'(';cur='0';rst=false;}
        else if(l==='√'){expr=(expr||cur)+'√(';cur='0';}else if(l==='x²'){expr=(expr||cur)+'^2';cur='0';}else if(l==='n!'){expr=(expr||cur)+'!';cur='0';}else if(l==='π'){expr=(expr||cur)+'π';cur='0';}else if(l==='e'){expr=(expr||cur)+'2.71828182846';cur='0';}else if(l==='^'){expr=(expr||cur)+'^';cur='0';}
        else if(['+','−','×','÷'].includes(l)){rst=false;expr=(expr||cur)+l;cur='0';}
        else if(l==='±'){if(expr){const m=expr.match(/(-?[\d.]+)$/);if(m)expr=expr.slice(0,-m[1].length)+String(-parseFloat(m[1]));}else cur=String(-parseFloat(cur));}
        else if(l==='('||l===')'){expr=(expr||cur)+l;cur='0';}
        else{if(rst){cur='0';expr='';rst=false;}cur==='0'&&l!=='.'?cur=l:cur+=l;}
        upd();
    };});
    upd();
}

function initGraphCalc(view){
    window._drawGraph=function(){
        const canvas=view.querySelector('#graphCanvas'); const eq=(view.querySelector('#graphEq')?.value||'x*x').trim();
        const xMin=parseFloat(view.querySelector('#graphXMin')?.value||-5), xMax=parseFloat(view.querySelector('#graphXMax')?.value||5);
        const ctx=canvas.getContext('2d'); const w=canvas.width,h=canvas.height;
        ctx.clearRect(0,0,w,h); ctx.fillStyle=getComputedStyle(document.body).getPropertyValue('--surface2').trim()||'#1a1a22'; ctx.fillRect(0,0,w,h);
        const xRange=xMax-xMin, yMin=-10,yMax=10,yRange=yMax-yMin;
        const toPx=x=>((x-xMin)/xRange)*w; const toPy=y=>h-((y-yMin)/yRange)*h;
        ctx.strokeStyle='#444'; ctx.lineWidth=0.5;
        for(let i=Math.ceil(xMin);i<=xMax;i++){ctx.beginPath();ctx.moveTo(toPx(i),0);ctx.lineTo(toPx(i),h);ctx.stroke();}
        for(let i=Math.ceil(yMin);i<=yMax;i++){ctx.beginPath();ctx.moveTo(0,toPy(i));ctx.lineTo(w,toPy(i));ctx.stroke();}
        ctx.strokeStyle='#888';ctx.lineWidth=1.5; ctx.beginPath();ctx.moveTo(toPx(0),0);ctx.lineTo(toPx(0),h);ctx.stroke(); ctx.beginPath();ctx.moveTo(0,toPy(0));ctx.lineTo(w,toPy(0));ctx.stroke();
        ctx.strokeStyle='#6c5ce7';ctx.lineWidth=2; ctx.beginPath(); let first=true;
        for(let px=0;px<=w;px++){const x=xMin+(px/w)*xRange; try{const y=Function('x','"use strict";return ('+eq+')')(x); if(isFinite(y)&&Math.abs(y)<1000){const py=toPy(y); if(first){ctx.moveTo(px,py);first=false;}else ctx.lineTo(px,py);}else{first=true;}}catch{first=true;}}
        ctx.stroke(); view.querySelector('#graphResult').textContent='f(x) = '+eq;
    };
    setTimeout(()=>window._drawGraph(),300);
}

window._solveQuadratic=()=>{const a=parseFloat(document.getElementById('qa')?.value||1),b=parseFloat(document.getElementById('qb')?.value||0),c=parseFloat(document.getElementById('qc')?.value||0);const d=b*b-4*a*c;let r;if(d>0){const r1=(-b+Math.sqrt(d))/(2*a),r2=(-b-Math.sqrt(d))/(2*a);r=`D=${d}\nx₁=${r1.toFixed(4)}, x₂=${r2.toFixed(4)}`;}else if(d===0){const x=-b/(2*a);r=`D=0\nx=${x.toFixed(4)}`;}else{const re=(-b/(2*a)).toFixed(4),im=(Math.sqrt(-d)/(2*a)).toFixed(4);r=`D=${d}\n${re} ± ${im}i`;}document.getElementById('quadResult').textContent=r;};
window._calcFraction=()=>{const n1=parseInt(document.getElementById('fNum1')?.value||1),d1=parseInt(document.getElementById('fDen1')?.value||1),n2=parseInt(document.getElementById('fNum2')?.value||1),d2=parseInt(document.getElementById('fDen2')?.value||1),op=document.getElementById('fOp')?.value||'+';let num,den;switch(op){case'+':num=n1*d2+n2*d1;den=d1*d2;break;case'-':num=n1*d2-n2*d1;den=d1*d2;break;case'*':num=n1*n2;den=d1*d2;break;case'/':num=n1*d2;den=d1*n2;break;}const g=(a,b)=>b===0?Math.abs(a):g(b,a%b);const gcd=g(Math.abs(num),Math.abs(den));num/=gcd;den/=gcd;if(den<0){num=-num;den=-den;}document.getElementById('fracResult').textContent=`${num}/${den}`+(den!==1?` ≈ ${(num/den).toFixed(4)}`:` = ${num}`);};
window._calcPercentage=()=>{const v=parseFloat(document.getElementById('pVal')?.value||100),p=parseFloat(document.getElementById('pPct')?.value||20);document.getElementById('pctResult').textContent=`${p}% × ${v} = ${(v*p/100).toFixed(2)}`;};
window._calcGPA=()=>{const grades=document.querySelectorAll('.gpa-grade'),credits=document.querySelectorAll('.gpa-credit');let tp=0,tc=0;grades.forEach((g,i)=>{const gr=parseFloat(g.value),cr=parseFloat(credits[i]?.value||0);if(!isNaN(gr)&&!isNaN(cr)){tp+=gr*cr;tc+=cr;}});document.getElementById('gpaResult').textContent=tc>0?`GPA: ${(tp/tc).toFixed(2)} (${tc} ক্রেডিট)`:'কোর্স যোগ করুন';};

window._calcAge=()=>{const ds=document.getElementById('ageDate')?.value;if(!ds)return;const birth=new Date(ds),now=new Date();let y=now.getFullYear()-birth.getFullYear(),m=now.getMonth()-birth.getMonth(),d=now.getDate()-birth.getDate();if(d<0){m--;d+=new Date(now.getFullYear(),now.getMonth(),0).getDate();}if(m<0){y--;m+=12;}const td=Math.floor((now-birth)/86400000);document.getElementById('ageResult').textContent=`${y} ${t('age_years')}, ${m} ${t('age_months')}, ${d} ${t('age_days')}\n${t('age_total')}: ${td}`;};
window._calcBMI=()=>{const w=parseFloat(document.getElementById('bmiWeight')?.value||70),h=parseFloat(document.getElementById('bmiHeight')?.value||170)/100;const bmi=w/(h*h);const st=bmi<18.5?'কম ওজন':bmi<25?'স্বাভাবিক':bmi<30?'অতিরিক্ত':'স্থূল';document.getElementById('bmiResult').textContent=`BMI: ${bmi.toFixed(1)} — ${st}`;};

window._updateUnitSelects=()=>{const type=document.getElementById('unitType')?.value||'length';const units={length:['meter','kilometer','mile','foot','inch','cm'],weight:['kg','gram','pound','ounce','ton'],temp:['celsius','fahrenheit','kelvin'],speed:['m/s','km/h','mph','knot'],area:['m²','km²','hectare','acre','ft²'],volume:['liter','ml','gallon','m³','ft³']};const u=units[type]||units.length;const from=document.getElementById('unitFrom'),to=document.getElementById('unitTo');if(from&&to){from.innerHTML=u.map(un=>`<option value="${un}">${t(UNIT_KEYS[un])}</option>`).join('');to.innerHTML=u.map(un=>`<option value="${un}">${t(UNIT_KEYS[un])}</option>`).join('');to.value=u[1]||u[0];}};
window._convertUnit=()=>{const val=parseFloat(document.getElementById('unitVal')?.value||1),type=document.getElementById('unitType')?.value||'length',from=document.getElementById('unitFrom')?.value,to=document.getElementById('unitTo')?.value;const factors={meter:1,kilometer:1000,mile:1609.34,foot:0.3048,inch:0.0254,cm:0.01,kg:1,gram:0.001,pound:0.453592,ounce:0.0283495,ton:1000,'m/s':1,'km/h':0.277778,mph:0.44704,knot:0.514444,'m²':1,'km²':1e6,hectare:10000,acre:4046.86,'ft²':0.092903,liter:1,ml:0.001,gallon:3.78541,'m³':1000,'ft³':28.3168};let result;if(type==='temp'){let c;if(from==='celsius')c=val;else if(from==='fahrenheit')c=(val-32)*5/9;else c=val-273.15;if(to==='celsius')result=c;else if(to==='fahrenheit')result=c*9/5+32;else result=c+273.15;}else{const base=val*(factors[from]||1);result=base/(factors[to]||1);}document.getElementById('unitResult').textContent=`${val} ${t(UNIT_KEYS[from])} = ${result.toFixed(6)} ${t(UNIT_KEYS[to])}`;};
window._calcDateDiff=()=>{const d1=new Date(document.getElementById('dtDate1')?.value),d2=new Date(document.getElementById('dtDate2')?.value);if(isNaN(d1)||isNaN(d2))return;const diff=Math.abs(d2-d1),days=Math.floor(diff/86400000);document.getElementById('dtResult').textContent=t('datetime_diff').replace('{days}',days).replace('{months}',Math.floor(days/30)).replace('{years}',(days/365.25).toFixed(1));};
window._calcEMI=()=>{const P=parseFloat(document.getElementById('emiPrincipal')?.value||100000),r=parseFloat(document.getElementById('emiRate')?.value||10)/1200,n=parseInt(document.getElementById('emiTenure')?.value||12);const emi=P*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1);document.getElementById('emiResult').textContent=`EMI: ${emi.toFixed(2)}/মাস, মোট: ${(emi*n).toFixed(2)}`;};

window._calcTax=()=>{const inc=parseFloat(document.getElementById('taxIncome')?.value||50000),reg=document.getElementById('taxRegion')?.value||'simple';let tax=reg==='simple'?inc*0.1:inc<=10000?inc*0.05:inc<=50000?500+(inc-10000)*0.15:6500+(inc-50000)*0.25;document.getElementById('taxResult').textContent=`আনুমানিক কর: ${tax.toFixed(2)}`;};
window._matrixOp=(op)=>{const a=[[parseFloat(document.getElementById('mA11')?.value||1),parseFloat(document.getElementById('mA12')?.value||2)],[parseFloat(document.getElementById('mA21')?.value||3),parseFloat(document.getElementById('mA22')?.value||4)]];const b=[[parseFloat(document.getElementById('mB11')?.value||1),parseFloat(document.getElementById('mB12')?.value||0)],[parseFloat(document.getElementById('mB21')?.value||0),parseFloat(document.getElementById('mB22')?.value||1)]];let r='';if(op==='add')r=`[${a[0][0]+b[0][0]}, ${a[0][1]+b[0][1]}]\n[${a[1][0]+b[1][0]}, ${a[1][1]+b[1][1]}]`;else if(op==='multiply')r=`[${a[0][0]*b[0][0]+a[0][1]*b[1][0]}, ${a[0][0]*b[0][1]+a[0][1]*b[1][1]}]\n[${a[1][0]*b[0][0]+a[1][1]*b[1][0]}, ${a[1][0]*b[0][1]+a[1][1]*b[1][1]}]`;else if(op==='det')r=`det(A)=${a[0][0]*a[1][1]-a[0][1]*a[1][0]}`;else if(op==='inv'){const det=a[0][0]*a[1][1]-a[0][1]*a[1][0];r=det===0?'ইনভার্স নেই':`[${(a[1][1]/det).toFixed(4)}, ${(-a[0][1]/det).toFixed(4)}]\n[${(-a[1][0]/det).toFixed(4)}, ${(a[0][0]/det).toFixed(4)}]`;}else if(op==='transpose')r=`[${a[0][0]}, ${a[1][0]}]\n[${a[0][1]}, ${a[1][1]}]`;document.getElementById('matrixResult').textContent=r;};
window._vectorOp=(op)=>{const ax=parseFloat(document.getElementById('vAx')?.value||1),ay=parseFloat(document.getElementById('vAy')?.value||2),az=parseFloat(document.getElementById('vAz')?.value||3),bx=parseFloat(document.getElementById('vBx')?.value||4),by=parseFloat(document.getElementById('vBy')?.value||5),bz=parseFloat(document.getElementById('vBz')?.value||6);let r;if(op==='dot')r=`A·B=${ax*bx+ay*by+az*bz}`;else if(op==='cross')r=`A×B=(${ay*bz-az*by}, ${az*bx-ax*bz}, ${ax*by-ay*bx})`;else r=`|A|=${Math.sqrt(ax*ax+ay*ay+az*az).toFixed(4)}`;document.getElementById('vectorResult').textContent=r;};
window._calcStatistics=()=>{const data=(document.getElementById('statData')?.value||'').split(',').map(Number).filter(n=>!isNaN(n));if(!data.length)return;data.sort((a,b)=>a-b);const mean=data.reduce((s,v)=>s+v,0)/data.length;const median=data.length%2===0?(data[data.length/2-1]+data[data.length/2])/2:data[Math.floor(data.length/2)];const mode=data.sort((a,b)=>data.filter(v=>v===a).length-data.filter(v=>v===b).length).pop();const variance=data.reduce((s,v)=>s+(v-mean)**2,0)/data.length;document.getElementById('statResult').textContent=`গড়: ${mean.toFixed(4)}, মধ্যমা: ${median}, প্রচুরক: ${mode}, ভেদাংক: ${variance.toFixed(4)}, SD: ${Math.sqrt(variance).toFixed(4)}`;};
window._solveTriangle=()=>{const a=parseFloat(document.getElementById('triA')?.value)||0,b=parseFloat(document.getElementById('triB')?.value)||0,c=parseFloat(document.getElementById('triC')?.value)||0;if(a&&b&&c){const cosA=(b*b+c*c-a*a)/(2*b*c),cosB=(a*a+c*c-b*b)/(2*a*c),cosC=(a*a+b*b-c*c)/(2*a*b);document.getElementById('triResult').textContent=`কোণ A: ${(Math.acos(cosA)*180/Math.PI).toFixed(2)}°, B: ${(Math.acos(cosB)*180/Math.PI).toFixed(2)}°, C: ${(Math.acos(cosC)*180/Math.PI).toFixed(2)}°`;}else{document.getElementById('triResult').textContent='তিনটি বাহু লিখুন';}};
window._updateGeoInputs=()=>{const shape=document.getElementById('geoShape')?.value||'circle';const c=document.getElementById('geoInputs');const map={circle:`<input type="number" id="geoR" placeholder="${t('geo_radius')}" value="5">`,triangle:`<input type="number" id="geoBase" placeholder="${t('geo_base')}" value="5"><input type="number" id="geoHeight" placeholder="${t('geo_height')}" value="8">`,rectangle:`<input type="number" id="geoW" placeholder="${t('geo_width')}" value="5"><input type="number" id="geoH" placeholder="${t('geo_height')}" value="10">`,sphere:`<input type="number" id="geoR" placeholder="${t('geo_radius')}" value="5">`,cone:`<input type="number" id="geoR" placeholder="${t('geo_radius')}" value="3"><input type="number" id="geoH" placeholder="${t('geo_height')}" value="7">`,cylinder:`<input type="number" id="geoR" placeholder="${t('geo_radius')}" value="3"><input type="number" id="geoH" placeholder="${t('geo_height')}" value="7">`};c.innerHTML=map[shape]||map.circle;};
window._calcGeometry=()=>{const shape=document.getElementById('geoShape')?.value||'circle';let r='';const getR=()=>parseFloat(document.getElementById('geoR')?.value||5);if(shape==='circle'){const rad=getR();r=`ক্ষেত্রফল: ${(Math.PI*rad*rad).toFixed(4)}, পরিধি: ${(2*Math.PI*rad).toFixed(4)}`;}else if(shape==='triangle'){const b=parseFloat(document.getElementById('geoBase')?.value||5),h=parseFloat(document.getElementById('geoHeight')?.value||8);r=`ক্ষেত্রফল: ${(0.5*b*h).toFixed(4)}`;}else if(shape==='rectangle'){const w=parseFloat(document.getElementById('geoW')?.value||5),h=parseFloat(document.getElementById('geoH')?.value||10);r=`ক্ষেত্রফল: ${(w*h).toFixed(4)}, পরিসীমা: ${(2*(w+h)).toFixed(4)}`;}else if(shape==='sphere'){const rad=getR();r=`পৃষ্ঠ: ${(4*Math.PI*rad*rad).toFixed(4)}, আয়তন: ${(4/3*Math.PI*rad*rad*rad).toFixed(4)}`;}else if(shape==='cone'){const rad=getR(),h=parseFloat(document.getElementById('geoH')?.value||7);r=`আয়তন: ${(Math.PI*rad*rad*h/3).toFixed(4)}`;}else if(shape==='cylinder'){const rad=getR(),h=parseFloat(document.getElementById('geoH')?.value||7);r=`আয়তন: ${(Math.PI*rad*rad*h).toFixed(4)}`;}document.getElementById('geoResult').textContent=r;};
window._checkPrime=()=>{const n=parseInt(document.getElementById('primeNum')?.value||97);if(n<2){document.getElementById('primeResult').textContent='মৌলিক নয়';return;}let p=true;for(let i=2;i<=Math.sqrt(n);i++)if(n%i===0){p=false;break;}document.getElementById('primeResult').textContent=`${n} ${p?'মৌলিক':'মৌলিক নয়'}`;};
window._primeFactors=()=>{let n=parseInt(document.getElementById('primeNum')?.value||97);const f=[];let d=2;while(d*d<=n){while(n%d===0){f.push(d);n/=d;}d++;}if(n>1)f.push(n);document.getElementById('primeResult').textContent=`উৎপাদক: ${f.join('×')}`;};
window._genPrimes=()=>{const n=parseInt(document.getElementById('primeNum')?.value||50);const p=[];for(let i=2;i<=n;i++){let ip=true;for(let j=2;j<=Math.sqrt(i);j++)if(i%j===0){ip=false;break;}if(ip)p.push(i);}document.getElementById('primeResult').textContent=`${n} পর্যন্ত মৌলিক: ${p.join(', ')} (${p.length}টি)`;};

window._calcDiscount=()=>{const price=parseFloat(document.getElementById('discPrice')?.value||1000),pct=parseFloat(document.getElementById('discPct')?.value||20);const saved=price*pct/100;document.getElementById('discResult').textContent=`সাশ্রয়: ${saved.toFixed(2)}, মূল্য: ${(price-saved).toFixed(2)}`;};
window._calcTimezone=()=>{const from=parseFloat(document.getElementById('tzFrom')?.value||0),to=parseFloat(document.getElementById('tzTo')?.value||-5);const now=new Date();const utc=now.getTime()+now.getTimezoneOffset()*60000;const ft=new Date(utc+from*3600000),tt=new Date(utc+to*3600000);document.getElementById('tzResult').textContent=`প্রথম: ${ft.toLocaleTimeString()}, দ্বিতীয়: ${tt.toLocaleTimeString()}, পার্থক্য: ${to-from} ঘণ্টা`;};
window._simplifyAlgebra=()=>{const expr=document.getElementById('algExpr')?.value||'2x+3x-5';const terms=expr.replace(/\s/g,'').match(/([+-]?\d*\.?\d*)x?/g)?.filter(Boolean)||[];let coeff=0,constant=0;terms.forEach(t=>{if(t.includes('x')){const c=t.replace('x','');coeff+=parseFloat(c===''||c==='+'?1:c==='-'?-1:c)||0;}else if(t)constant+=parseFloat(t)||0;});document.getElementById('algResult').textContent=`সরলীকৃত: ${coeff}x ${constant>=0?'+':''} ${constant}`;};

// ==================== NAVIGATION ====================
function navigateTo(calcId){
    if(calcId==='home'){closeCalculator();return;}
    if(calcId==='favorites'){closeCalculator();document.getElementById('contentArea').scrollTo({top:document.getElementById('favoritesGrid').offsetTop-50,behavior:'smooth'});return;}
    const map={basic:'basic',scientific:'scientific',convert:'unit_converter'};
    openCalculator(map[calcId]||calcId);
}
document.querySelectorAll('#bottomNav .nav-item').forEach(item=>{item.onclick=()=>{document.querySelectorAll('#bottomNav .nav-item').forEach(n=>n.classList.remove('active'));item.classList.add('active');navigateTo(item.dataset.nav);};});
searchInput.oninput=()=>{if(STATE.currentView==='dashboard'){const cat=sidebar.querySelector('.sidebar-category.active')?.dataset.cat||'all';renderDashboard(cat,searchInput.value.trim());}};
sidebar.querySelectorAll('.sidebar-category').forEach(cat=>{cat.onclick=()=>{sidebar.querySelectorAll('.sidebar-category').forEach(c=>c.classList.remove('active'));cat.classList.add('active');closeCalculator();renderDashboard(cat.dataset.cat,searchInput.value.trim());if(window.innerWidth<=768){sidebar.classList.remove('open');overlay.classList.remove('show');}};});
document.getElementById('btnMenu').onclick=()=>{if(window.innerWidth<=768){sidebar.classList.toggle('open');overlay.classList.toggle('show');}};
document.getElementById('btnSettings').onclick=()=>{document.getElementById('settingsModal').classList.add('show');document.getElementById('langBn').classList.toggle('active',currentLang==='bn');document.getElementById('langEn').classList.toggle('active',currentLang==='en');};
document.getElementById('btnGuide').onclick=()=>{updateGuideContent();document.getElementById('guideModal').classList.add('show');};
document.getElementById('btnFavorites').onclick=()=>{closeCalculator();setTimeout(()=>document.getElementById('contentArea').scrollTo({top:document.getElementById('favoritesGrid').offsetTop-50,behavior:'smooth'}),200);};
document.querySelectorAll('.modal-overlay').forEach(m=>{m.onclick=e=>{if(e.target===m)m.classList.remove('show');};});
overlay.onclick=()=>{sidebar.classList.remove('open');overlay.classList.remove('show');};

// ==================== INIT ====================
function initAll(){
    applyLanguage();
    renderDashboard(); renderRecent();
    window._updateUnitSelects();
    if(document.getElementById('geoShape'))window._updateGeoInputs();
    if(document.getElementById('chemType'))window._updateChemInputs();
    if(document.getElementById('healthType'))window._updateHealthInputs();
    const today=new Date().toISOString().split('T')[0];
    const dt1=document.getElementById('dtDate1'); if(dt1)dt1.value=today;
    const dt2=document.getElementById('dtDate2'); if(dt2)dt2.value=today;
    const ad=document.getElementById('ageDate'); if(ad&&!ad.value)ad.value='2000-01-01';
}
initAll();
console.log('🧮 Universal Calculator Hub | সম্পূর্ণ দ্বিভাষিক');
})();
</script>
