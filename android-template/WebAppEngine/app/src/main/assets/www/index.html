<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Naim's Ultra Premium Gallery</title>
    <style>
        :root {
            --primary: #3b82f6;
            --surface: #0f172a;
            --glass: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.1);
            --text: #f8fafc;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--surface);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow-x: hidden;
            user-select: none;
        }

        #welcomePopup {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: radial-gradient(circle at top right, #1e293b, #020617);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: transform 1.2s cubic-bezier(0.85, 0, 0.15, 1);
        }

        #welcomePopup.hidden {
            transform: translateY(-100%);
        }

        .welcome-content {
            text-align: center;
            padding: 2rem;
            max-width: 400px;
        }

        .welcome-logo {
            width: 150px;
            height: 150px;
            border-radius: 40px;
            object-fit: cover;
            border: 4px solid var(--primary);
            box-shadow: 0 0 50px rgba(59, 130, 246, 0.3);
            margin-bottom: 2rem;
            animation: floating 3s ease-in-out infinite;
        }

        @keyframes floating {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }

        .lyric {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(to right, #60a5fa, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 2.5rem;
            line-height: 1.4;
        }

        .btn-start {
            background: var(--primary);
            color: white;
            padding: 1.2rem 3rem;
            border: none;
            border-radius: 20px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.4);
            transition: 0.3s;
        }

        .btn-start:active { transform: scale(0.95); }

        .main-app {
            padding: 1rem;
            opacity: 0;
            transition: opacity 1s;
        }

        .main-app.visible { opacity: 1; }

        .header {
            padding: 3rem 1rem;
            text-align: center;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            max-width: 900px;
            margin: 0 auto;
        }

        .card {
            aspect-ratio: 1;
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            position: relative;
            transform: scale(0.9);
            opacity: 0;
            transition: transform 0.6s, opacity 0.6s;
        }

        .card.loaded {
            transform: scale(1);
            opacity: 1;
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: 0.5s;
        }

        .card:hover img { transform: scale(1.1); }

        #lightbox {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 10000;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #lightbox.active { display: flex; }

        .lb-controls {
            position: absolute;
            top: 20px;
            left: 0;
            width: 100%;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 11;
        }

        .control-group {
            display: flex;
            gap: 15px;
            background: rgba(0,0,0,0.4);
            padding: 8px 15px;
            border-radius: 50px;
            backdrop-filter: blur(10px);
        }

        .icon-btn {
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .lb-image-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        #lbImg {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* প্রগ্রেস বার */
        .progress-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.1);
        }

        #progressBar {
            height: 100%;
            width: 0%;
            background: var(--primary);
            transition: width 0.3s linear;
        }

        .counter {
            position: absolute;
            bottom: 30px;
            background: rgba(255,255,255,0.1);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            backdrop-filter: blur(10px);
        }

        /* সাইড নেভিগেশন */
        .nav-side {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 20%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            opacity: 0;
            transition: 0.3s;
            z-index: 10;
        }

        .nav-side:hover { opacity: 1; background: linear-gradient(to right, rgba(0,0,0,0.5), transparent); }
        .nav-right:hover { background: linear-gradient(to left, rgba(0,0,0,0.5), transparent); }
        .nav-left { left: 0; }
        .nav-right { right: 0; }

        .svg-icon { width: 24px; height: 24px; fill: currentColor; }

        @media (max-width: 480px) {
            .gallery-grid { grid-template-columns: repeat(3, 1fr); gap: 6px; }
            .welcome-logo { width: 120px; height: 120px; }
        }
    </style>
</head>
<body>

    <div id="welcomePopup">
        <div class="welcome-content">
            <img src="image/logo.png" class="welcome-logo" alt="Logo" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'150\' height=\'150\'><rect width=\'100%\' height=\'100%\' fill=\'%231e293b\'/><text x=\'50%\' y=\'50%\' font-size=\'40\' fill=\'white\' text-anchor=\'middle\' dominant-baseline=\'middle\'>♪</text></svg>'">
            <div class="lyric">
                "হৃদয় জুড়ে তুমি আছো,<br>স্বপ্ন হয়ে ভালোবাসো..."
            </div>
            <button class="btn-start" onclick="startApp()">Explore Gallery</button>
        </div>
    </div>

    <div class="main-app" id="mainApp">
        <header class="header">
            <h1 style="font-size: 2rem; margin-bottom: 0.5rem;">Collection</h1>
            <p style="color: #64748b;">A premium visual journey</p>
        </header>

        <div class="gallery-grid" id="grid">
            <!-- Images injected by JS -->
        </div>
    </div>

    <div id="lightbox">
        <div class="lb-controls">
            <div class="control-group">
                <button class="icon-btn" onclick="togglePlay()" id="playBtn">
                    <svg class="svg-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                </button>
                <button class="icon-btn" onclick="toggleFullScreen()">
                    <svg class="svg-icon" viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
                </button>
            </div>
            <button class="icon-btn" onclick="closeLightbox()" style="background: rgba(239, 68, 68, 0.2); border-radius: 50%;">
                <svg class="svg-icon" viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
            </button>
        </div>

        <div class="nav-side nav-left" onclick="changeImage(-1)">
            <svg class="svg-icon" viewBox="0 0 24 24" style="width: 40px; height: 40px;"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
        </div>

        <div class="lb-image-container">
            <img src="" id="lbImg">
        </div>

        <div class="nav-side nav-right" onclick="changeImage(1)">
            <svg class="svg-icon" viewBox="0 0 24 24" style="width: 40px; height: 40px;"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
        </div>

        <div class="counter" id="counter">1 / 23</div>
        <div class="progress-container">
            <div id="progressBar"></div>
        </div>
    </div>

    <script>
        const totalImages = 23;
        const grid = document.getElementById('grid');
        const mainApp = document.getElementById('mainApp');
        const lightbox = document.getElementById('lightbox');
        const lbImg = document.getElementById('lbImg');
        const counter = document.getElementById('counter');
        const progressBar = document.getElementById('progressBar');
        const playBtn = document.getElementById('playBtn');

        let currentIndex = 1;
        let isPlaying = false;
        let slideInterval;

        // গ্যালারী শুরু করা
        function startApp() {
            document.getElementById('welcomePopup').classList.add('hidden');
            mainApp.classList.add('visible');
            loadGrid();
        }

        // গ্রিড লোড করা (Staggered Animation সহ)
        function loadGrid() {
            for (let i = 1; i <= totalImages; i++) {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `<img src="image/${i}.png" loading="lazy" onerror="handleError(this)">`;
                card.onclick = () => openLightbox(i);
                grid.appendChild(card);
                
                // এন্ট্রেন্স অ্যানিমেশন ডিলে
                setTimeout(() => card.classList.add('loaded'), i * 50);
            }
        }

        function handleError(img) {
            img.src = `data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><rect width='100%' height='100%' fill='%231e293b'/><text x='50%' y='50%' font-size='20' fill='white' text-anchor='middle'>Image ${img.src.split('/').pop()}</text></svg>`;
        }

        // লাইটবক্স ওপেন
        function openLightbox(index) {
            currentIndex = index;
            lightbox.classList.add('active');
            updateLightbox();
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            lightbox.classList.remove('active');
            stopSlideshow();
            document.body.style.overflow = 'auto';
        }

        function updateLightbox() {
            lbImg.style.opacity = '0';
            setTimeout(() => {
                lbImg.src = `image/${currentIndex}.png`;
                lbImg.style.opacity = '1';
                counter.textContent = `${currentIndex} / ${totalImages}`;
            }, 150);
        }

        function changeImage(step) {
            currentIndex += step;
            if (currentIndex > totalImages) currentIndex = 1;
            if (currentIndex < 1) currentIndex = totalImages;
            updateLightbox();
            if (isPlaying) resetSlideshow();
        }

        // স্লাইডশো কন্ট্রোল
        function togglePlay() {
            if (isPlaying) stopSlideshow();
            else startSlideshow();
        }

        function startSlideshow() {
            isPlaying = true;
            playBtn.innerHTML = `<svg class="svg-icon" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>`;
            resetSlideshow();
        }

        function stopSlideshow() {
            isPlaying = false;
            playBtn.innerHTML = `<svg class="svg-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>`;
            clearInterval(slideInterval);
            progressBar.style.width = '0%';
        }

        function resetSlideshow() {
            clearInterval(slideInterval);
            let width = 0;
            progressBar.style.width = '0%';
            slideInterval = setInterval(() => {
                width += 1;
                progressBar.style.width = width + '%';
                if (width >= 100) {
                    changeImage(1);
                }
            }, 30); // ৩ সেকেন্ডের স্লাইডশো
        }

        // ফুলস্ক্রিন কন্ট্রোল
        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        }

        // কিবোর্ড নেভিগেশন
        document.addEventListener('keydown', (e) => {
            if (!lightbox.classList.contains('active')) return;
            if (e.key === 'ArrowRight') changeImage(1);
            if (e.key === 'ArrowLeft') changeImage(-1);
            if (e.key === 'Escape') closeLightbox();
            if (e.key === ' ') togglePlay();
        });
    </script>
</body>
</html>
