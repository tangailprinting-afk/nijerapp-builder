                if (n < 2) { document.getElementById('primeResult').textContent = `${n} is NOT prime`;
                    return; }
                let isPrime = true;
                for (let i = 2; i <= Math.sqrt(n); i++) { if (n % i === 0) { isPrime = false; break; } }
                document.getElementById('primeResult').textContent = `${n} is ${isPrime?'':'NOT '}prime`;
            };
            window._primeFactors = () => {
                let n = parseInt(document.getElementById('primeNum')?.value || 97);
                const factors = [];
                let d = 2;
                while (d * d <= n) { while (n % d === 0) { factors.push(d);
                        n /= d; } d++; }
                if (n > 1) factors.push(n);
                document.getElementById('primeResult').textContent = `Prime factors: ${factors.join(' × ')}`;
            };
            window._genPrimes = () => {
                const n = parseInt(document.getElementById('primeNum')?.value || 50);
                const primes = [];
                for (let i = 2; i <= n; i++) {
                    let isP = true;
                    for (let j = 2; j <= Math.sqrt(i); j++) { if (i % j === 0) { isP = false; break; } }
                    if (isP) primes.push(i);
                }
                document.getElementById('primeResult').textContent =
                    `Primes up to ${n}: ${primes.slice(0,20).join(', ')}${primes.length>20?'...':''} (${primes.length} total)`;
            };
            window._convertProg = () => {
                const val = document.getElementById('progInput')?.value?.trim() || '255';
                const base = parseInt(document.getElementById('progBase')?.value || 10);
                const num = parseInt(val, base);
                if (isNaN(num)) { document.getElementById('progResult').textContent = 'Invalid input'; return; }
                document.getElementById('progResult').textContent =
                    `Binary: ${num.toString(2)}\nOctal: ${num.toString(8)}\nDecimal: ${num.toString(10)}\nHex: ${num.toString(16).toUpperCase()}`;
            };
            window._genPassword = () => {
                const len = parseInt(document.getElementById('pwLen')?.value || 16);
                const special = document.getElementById('pwSpecial')?.checked;
                const chars = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789' + (special ?
                    '!@#$%^&*()_+-=[]{}|;:,.<>?' : '');
                let pw = '';
                for (let i = 0; i < len; i++) pw += chars[Math.floor(Math.random() * chars.length)];
                document.getElementById('pwResult').textContent = pw;
            };
            window._genRandom = () => {
                const min = parseInt(document.getElementById('rnMin')?.value || 1);
                const max = parseInt(document.getElementById('rnMax')?.value || 100);
                const count = parseInt(document.getElementById('rnCount')?.value || 1);
                const nums = [];
                for (let i = 0; i < Math.min(count, 100); i++) nums.push(Math.floor(Math.random() * (max - min +
                    1)) + min);
                document.getElementById('rnResult').textContent = nums.join(', ');
            };
            window._calcOhm = () => {
                const V = document.getElementById('ohmV')?.value;
                const I = document.getElementById('ohmI')?.value;
                const R = document.getElementById('ohmR')?.value;
                let result = '';
                if (V && I) result = `R = ${(V/I).toFixed(4)} Ω`;
                else if (V && R) result = `I = ${(V/R).toFixed(4)} A`;
                else if (I && R) result = `V = ${(I*R).toFixed(4)} V`;
                else result = 'Enter exactly two values';
                document.getElementById('ohmResult').textContent = result;
            };
            window._calcPhysics = () => {
                const f = document.getElementById('physFormula')?.value;
                const v1 = parseFloat(document.getElementById('physIn1')?.value || 10);
                const v2 = parseFloat(document.getElementById('physIn2')?.value || 5);
                let result;
                switch (f) {
                    case 'velocity':
                        result = `v = d/t = ${v1}/${v2} = ${(v1/v2).toFixed(4)} m/s`;
                        break;
                    case 'acceleration':
                        result = `a = Δv/t = ${v1}/${v2} = ${(v1/v2).toFixed(4)} m/s²`;
                        break;
                    case 'force':
                        result = `F = ma = ${v1}×${v2} = ${(v1*v2).toFixed(4)} N`;
                        break;
                    case 'work':
                        result = `W = Fd = ${v1}×${v2} = ${(v1*v2).toFixed(4)} J`;
                        break;
                    case 'ke':
                        result = `KE = ½mv² = ½×${v1}×${v2}² = ${(0.5*v1*v2*v2).toFixed(4)} J`;
                        break;
                    default:
                        result = 'Select formula';
                }
                document.getElementById('physResult').textContent = result;
            };
            window._updateChemInputs = () => {
                const type = document.getElementById('chemType')?.value;
                const container = document.getElementById('chemInputs');
                if (type === 'molar') container.innerHTML =
                    '<input type="text" id="chemFormula" placeholder="e.g., H2O" value="H2O">';
                else if (type === 'mole') container.innerHTML =
                    '<input type="number" id="chemMass" placeholder="Mass (g)" value="18"><input type="number" id="chemMW" placeholder="Molar Mass (g/mol)" value="18">';
                else container.innerHTML =
                    '<input type="number" id="chemH" placeholder="[H+] concentration" value="0.0001" step="any">';
            };
            window._calcChemistry = () => {
                const type = document.getElementById('chemType')?.value;
                let result = '';
                if (type === 'molar') {
                    const formula = document.getElementById('chemFormula')?.value || 'H2O';
                    const masses = { H: 1.008, O: 16, C: 12.01, N: 14, Na: 23, Cl: 35.45, Ca: 40, Fe: 55.85, S: 32 };
                    let total = 0;
                    const regex = /([A-Z][a-z]*)(\d*)/g;
                    let m;
                    while ((m = regex.exec(formula)) !== null) {
                        total += (masses[m[1]] || 0) * (parseInt(m[2]) || 1);
                    }
                    result = `Molar mass of ${formula}: ${total.toFixed(3)} g/mol`;
                } else if (type === 'mole') {
                    const mass = parseFloat(document.getElementById('chemMass')?.value || 18);
                    const mw = parseFloat(document.getElementById('chemMW')?.value || 18);
                    result = `Moles: ${(mass/mw).toFixed(4)} mol`;
                } else {
                    const h = parseFloat(document.getElementById('chemH')?.value || 0.0001);
                    result = `pH = ${(-Math.log10(h)).toFixed(2)}`;
                }
                document.getElementById('chemResult').textContent = result;
            };
            window._updateHealthInputs = () => {
                const type = document.getElementById('healthType')?.value;
                const container = document.getElementById('healthInputs');
                if (type === 'water') container.innerHTML =
                    '<input type="number" id="healthW" placeholder="Weight (kg)" value="70">';
                else if (type === 'calorie') container.innerHTML =
                    '<input type="number" id="healthW" placeholder="Weight (kg)" value="70"><select id="healthAct"><option value="1.2">Sedentary</option><option value="1.55">Moderate</option><option value="1.9">Active</option></select>';
                else container.innerHTML =
                    '<input type="number" id="healthW" placeholder="Weight (kg)" value="70"><input type="number" id="healthWaist" placeholder="Waist (cm)" value="80"><input type="number" id="healthHip" placeholder="Hip (cm)" value="95">';
            };
            window._calcHealth = () => {
                const type = document.getElementById('healthType')?.value;
                const w = parseFloat(document.getElementById('healthW')?.value || 70);
                let result = '';
                if (type === 'water') result = `Daily water intake: ${(w*0.033).toFixed(1)} liters`;
                else if (type === 'calorie') {
                    const act = parseFloat(document.getElementById('healthAct')?.value || 1.55);
                    result = `Daily calorie need: ~${Math.round(w*24*act)} kcal`;
                } else {
                    const waist = parseFloat(document.getElementById('healthWaist')?.value || 80);
                    const hip = parseFloat(document.getElementById('healthHip')?.value || 95);
                    result = `Waist-to-Hip Ratio: ${(waist/hip).toFixed(2)}`;
                }
                document.getElementById('healthResult').textContent = result;
            };
            window._calcBusiness = () => {
                const type = document.getElementById('bizType')?.value;
                const v1 = parseFloat(document.getElementById('bizIn1')?.value || 10000);
                const v2 = parseFloat(document.getElementById('bizIn2')?.value || 7000);
                let result = '';
                if (type === 'profit_margin') result = `Profit Margin: ${((v1-v2)/v1*100).toFixed(2)}%`;
                else if (type === 'roi') result = `ROI: ${((v2-v1)/v1*100).toFixed(2)}%`;
                else result = `Break-even units: ${Math.ceil(v1/(v1-v2))} (approx)`;
                document.getElementById('bizResult').textContent = result;
            };
            window._convertFileSize = () => {
                const val = parseFloat(document.getElementById('fsVal')?.value || 1);
                const from = document.getElementById('fsFrom')?.value || 'KB';
                const to = document.getElementById('fsTo')?.value || 'MB';
                const factors = { B: 1, KB: 1024, MB: 1048576, GB: 1073741824, TB: 1099511627776 };
                const result = val * (factors[from] || 1) / (factors[to] || 1);
                document.getElementById('fsResult').textContent = `${val} ${from} = ${result.toFixed(6)} ${to}`;
            };
            window._calcDownloadTime = () => {
                const speed = parseFloat(document.getElementById('isSpeed')?.value || 100);
                const size = parseFloat(document.getElementById('isSize')?.value || 1000);
                const seconds = (size * 8) / speed;
                const min = Math.floor(seconds / 60);
                const sec = Math.round(seconds % 60);
                document.getElementById('isResult').textContent =
                    `Download time: ${min}m ${sec}s (${seconds.toFixed(1)} seconds) at ${speed} Mbps`;
            };
            window._calcDPI = () => {
                const w = parseFloat(document.getElementById('dpiW')?.value || 1920);
                const h = parseFloat(document.getElementById('dpiH')?.value || 1080);
                const size = parseFloat(document.getElementById('dpiSize')?.value || 24);
                const diag = Math.sqrt(w * w + h * h);
                const ppi = diag / size;
                document.getElementById('dpiResult').textContent =
                    `PPI: ${ppi.toFixed(1)}\nAspect Ratio: ${(w/h).toFixed(2)}:1`;
            };
            window._convertColor = () => {
                const input = (document.getElementById('colorInput')?.value || '#ff6b9d').trim();
                let r, g, b;
                const hexMatch = input.match(/^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i);
                const rgbMatch = input.match(/rgb\((\d+),\s*(\d+),\s*(\d+)\)/);
                if (hexMatch) {
                    r = parseInt(hexMatch[1], 16);
                    g = parseInt(hexMatch[2], 16);
                    b = parseInt(hexMatch[3], 16);
                } else if (rgbMatch) {
                    r = parseInt(rgbMatch[1]);
                    g = parseInt(rgbMatch[2]);
                    b = parseInt(rgbMatch[3]);
                } else {
                    document.getElementById('colorResult').textContent = 'Invalid format. Use #rrggbb or rgb(r,g,b)';
                    return;
                }
                const toHex = (x) => x.toString(16).padStart(2, '0').toUpperCase();
                const hslR = r / 255,
                    hslG = g / 255,
                    hslB = b / 255;
                const max = Math.max(hslR, hslG, hslB),
                    min = Math.min(hslR, hslG, hslB);
                let h = 0,
                    s = 0,
                    l = (max + min) / 2;
                if (max !== min) {
                    const d = max - min;
                    s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
                    h = max === hslR ? ((hslG - hslB) / d + (hslG < hslB ? 6 : 0)) : max === hslG ? ((hslB - hslR) / d +
                        2) : ((hslR - hslG) / d + 4);
                    h /= 6;
                }
                document.getElementById('colorResult').textContent =
                    `HEX: #${toHex(r)}${toHex(g)}${toHex(b)}\nRGB: rgb(${r}, ${g}, ${b})\nHSL: hsl(${Math.round(h*360)}, ${Math.round(s*100)}%, ${Math.round(l*100)}%)`;
                const preview = document.getElementById('colorPreview');
                if (preview) preview.style.background = `rgb(${r},${g},${b})`;
            };
            window._decodeResistor = () => {
                const b1 = parseInt(document.getElementById('resBand1')?.value || 2);
                const b2 = parseInt(document.getElementById('resBand2')?.value || 3);
                const mult = parseInt(document.getElementById('resMult')?.value || 100);
                const val = (b1 * 10 + b2) * mult;
                document.getElementById('resResult').textContent =
                    `Resistance: ${val} Ω${val>=1000?' ('+(val/1000).toFixed(1)+' kΩ)':''}`;
            };
            window._calcFuel = () => {
                const dist = parseFloat(document.getElementById('fuelDist')?.value || 300);
                const eff = parseFloat(document.getElementById('fuelEff')?.value || 15);
                const price = parseFloat(document.getElementById('fuelPrice')?.value || 100);
                const liters = dist / eff;
                const cost = liters * price;
                document.getElementById('fuelResult').textContent =
                    `Fuel needed: ${liters.toFixed(2)} L\nTotal cost: ${cost.toFixed(2)}`;
            };
            window._calcTip = () => {
                const bill = parseFloat(document.getElementById('tipBill')?.value || 1000);
                const pct = parseFloat(document.getElementById('tipPct')?.value || 15);
                const split = parseInt(document.getElementById('tipSplit')?.value || 2);
                const tip = bill * pct / 100;
                const total = bill + tip;
                document.getElementById('tipResult').textContent =
                    `Tip: ${tip.toFixed(2)}\nTotal: ${total.toFixed(2)}\nPer person: ${(total/split).toFixed(2)} (${split} people)`;
            };
            window._calcDiscount = () => {
                const price = parseFloat(document.getElementById('discPrice')?.value || 1000);
                const pct = parseFloat(document.getElementById('discPct')?.value || 20);
                const saved = price * pct / 100;
                document.getElementById('discResult').textContent =
                    `You save: ${saved.toFixed(2)}\nFinal price: ${(price-saved).toFixed(2)}`;
            };
            window._calcTimezone = () => {
                const from = parseFloat(document.getElementById('tzFrom')?.value || 0);
                const to = parseFloat(document.getElementById('tzTo')?.value || -5);
                const now = new Date();
                const utc = now.getTime() + now.getTimezoneOffset() * 60000;
                const fromTime = new Date(utc + from * 3600000);
                const toTime = new Date(utc + to * 3600000);
                const diff = to - from;
                document.getElementById('tzResult').textContent =
                    `From: ${fromTime.toLocaleTimeString()}\nTo: ${toTime.toLocaleTimeString()}\nDifference: ${diff} hours`;
            };
            window._simplifyAlgebra = () => {
                const expr = document.getElementById('algExpr')?.value || '2x+3x-5';
                const terms = expr.replace(/\s/g, '').match(/([+-]?\d*\.?\d*)x?/g)?.filter(Boolean) || [];
                let coeff = 0,
                    constant = 0;
                terms.forEach(t => {
                    if (t.includes('x')) {
                        const c = t.replace('x', '');
                        coeff += parseFloat(c === '' || c === '+' ? 1 : c === '-' ? -1 : c) || 0;
                    } else if (t) constant += parseFloat(t) || 0;
                });
                document.getElementById('algResult').textContent =
                    `Simplified: ${coeff}x ${constant>=0?'+':''} ${constant}`;
            };

            // === NAVIGATION ===
            function navigateTo(calcId) {
                if (calcId === 'home') { closeCalculator(); return; }
                if (calcId === 'favorites') {
                    closeCalculator();
                    document.getElementById('contentArea').scrollTo({ top: document.getElementById('favoritesGrid')
                            .offsetTop - 60, behavior: 'smooth' });
                    return;
                }
                if (calcId === 'basic' || calcId === 'scientific' || calcId === 'convert') {
                    const map = { basic: 'basic', scientific: 'scientific', convert: 'unit_converter' };
                    openCalculator(map[calcId] || calcId);
                    return;
                }
                openCalculator(calcId);
            }

            bottomNav.querySelectorAll('.nav-item').forEach(item => {
                item.addEventListener('click', () => {
                    bottomNav.querySelectorAll('.nav-item').forEach(n => n.classList.remove(
                        'active'));
                    item.classList.add('active');
                    navigateTo(item.dataset.nav);
                });
            });

            // === SEARCH ===
            searchInput.addEventListener('input', () => {
                const q = searchInput.value.trim();
                if (STATE.currentView === 'dashboard') {
                    const activeCat = sidebar.querySelector('.sidebar-category.active')?.dataset.cat ||
                        'all';
                    renderDashboard(activeCat, q);
                }
            });

            // === SIDEBAR ===
            sidebar.querySelectorAll('.sidebar-category').forEach(cat => {
                cat.addEventListener('click', () => {
                    sidebar.querySelectorAll('.sidebar-category').forEach(c => c.classList.remove(
                        'active'));
                    cat.classList.add('active');
                    closeCalculator();
                    renderDashboard(cat.dataset.cat, searchInput.value.trim());
                    if (window.innerWidth <= 768) { sidebar.classList.remove('open');
                        overlay.classList.remove('show'); }
                });
            });

            // === MOBILE MENU ===
            btnMenu.addEventListener('click', () => {
                if (window.innerWidth <= 768) {
                    sidebar.classList.toggle('open');
                    overlay.classList.toggle('show');
                }
            });
            btnFavorites.addEventListener('click', () => {
                closeCalculator();
                renderDashboard('all', '');
                setTimeout(() => {
                    document.getElementById('contentArea').scrollTo({ top: document.getElementById(
                            'favoritesGrid').offsetTop - 60, behavior: 'smooth' });
                }, 200);
            });
            overlay.addEventListener('click', () => {
                sidebar.classList.remove('open');
                overlay.classList.remove('show');
            });

            // === INIT ===
            renderDashboard();
            renderRecent();
            window._updateUnitSelects();
            if (document.getElementById('geoShape')) window._updateGeoInputs();
            if (document.getElementById('chemType')) window._updateChemInputs();
            if (document.getElementById('healthType')) window._updateHealthInputs();

            // Set default dates
            const today = new Date().toISOString().split('T')[0];
            const dt1 = document.getElementById('dtDate1');
            const dt2 = document.getElementById('dtDate2');
            if (dt1) dt1.value = today;
            if (dt2) dt2.value = today;
            const ageDate = document.getElementById('ageDate');
            if (ageDate && !ageDate.value) ageDate.value = '2000-01-01';

            console.log('🧮 Universal Calculator Hub Ready!');
            console.log('📱 ' + CALCULATORS.length + ' calculators available');
            console.log('💡 Long-press/right-click on calculator cards to favorite');
            console.log('🔍 Use search to find calculators quickly');
        })();
    </script>
</body>
</html>
