<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Get Started</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      text-align: center;
    }

    .box {
      background: white;
      padding: 40px 25px;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0,0,0,.08);
      max-width: 400px;
      width: 90%;
    }

    h1 {
      margin-bottom: 10px;
    }

    p {
      color: #666;
      margin-bottom: 25px;
    }

    .btn {
      display: inline-block;
      padding: 13px 28px;
      background: #2563eb;
      color: white;
      text-decoration: none;
      border-radius: 10px;
      font-weight: bold;
    }

    .btn:hover {
      background: #1d4ed8;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>সমতা</h1>
    <p>সমতা থেকেই সম্ভাবনার শুরু</p>

    <a class="btn"
       href="https://easyearn-platform.vercel.app/"
       target="_blank">
      Get Started
    </a>
  </div>

</body>
</html>
